                - number
                - 'null'
              description: Speed over ground.
            headingDeg:
              type:
                - number
                - 'null'
              description: >
                Course, relative to true north. **Empty while stationary** — course over ground is
                not meaningful at rest, and populates once the device is moving.
            fixType:
              type:
                - integer
                - 'null'
              enum:
                - 2
                - 3
                - null
              description: '`2` for a 2D fix, `3` for 3D.'
            hdop:
              type:
                - number
                - 'null'
              description: >
                Horizontal dilution of precision — lower is a tighter fix. Treat it as the accuracy
                figure.
    Tracking:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        intervalSeconds:
          type:
            - integer
            - 'null'
          minimum: 1
          maximum: 65535
          description: How often a fresh position is read and published while enabled.
    TemplateDifference:
      type: object
      description: >
        One way the device differs from its template. Compared on ID numbers, types and type
        parameters, and on rules — **never on state**, which no template can guarantee.
      properties:
        kind:
          type: string
          enum:
            - id
            - rule
        idNumber:
          type:
            - integer
            - 'null'
        ruleNumber:
          type:
            - integer
            - 'null'
        difference:
          type: string
          enum:
            - missing
            - unexpected
            - changed
    ClaimResult:
      type: object
      required:
        - serial
        - configMatchesTemplate
      properties:
        serial:
          type: string
        name:
          type:
            - string
            - 'null'
        configMatchesTemplate:
          type: boolean
          description: >
            Whether the device's configuration still matches the template version it was built from.
            `false` means it has drifted, or the template has moved on.
        templateVersion:
          type:
            - integer
            - 'null'
          description: The version the device is currently on.
        latestTemplateVersion:
          type:
            - integer
            - 'null'
          description: The newest published version of its template.
        differences:
          type: array
          description: What differs, when `configMatchesTemplate` is false.
          items:
            $ref: '#/components/schemas/TemplateDifference'
        at:
          type: string
          format: date-time
    ConfigComparison:
      type: object
      required:
        - serial
        - configMatchesTemplate
      properties:
        serial:
          type: string
        configMatchesTemplate:
          type: boolean
        templateId:
          type:
            - string
            - 'null'
        templateVersion:
          type:
            - integer
            - 'null'
          description: The version the device is currently on.
        originalTemplateVersion:
          type:
            - integer
            - 'null'
          description: |
            The version the device **shipped** with. `reset` returns it to this, not to the newest.
        latestTemplateVersion:
          type:
            - integer
            - 'null'
        differences:
          type: array
          items:
            $ref: '#/components/schemas/TemplateDifference'
        at:
          type: string
          format: date-time
    SetStateAction:
      type: object
      description: Switch an output.
      required:
        - type
        - io
        - state
      properties:
        type:
          type: string
          const: setState
        io:
          type: integer
          description: >
            The ID to set. **Any output ID**, not only a `digitalOutput` -- and pointing one at a
            `momentaryOutput` or a `delayedOutput` is an intended use, not a loophole. The rule asks
            for a state and the ID does whatever it is configured to do with it: a momentary output
            drives for its `durationMs` and reverts, a delayed output waits out its `delayMs`.


            That is deliberate: rules and interrupts always do the configured thing -- a rule cannot
            ask for override semantics, so a gate trigger wired as a momentary output behaves the
            same whether a person pressed it or a rule fired it.
        state:
          $ref: '#/components/schemas/PinState'
    EnableRuleAction:
      type: object
      description: >
        Turn another rule on. Lets rules control each other — an alarm rule can arm a second rule,
        or a schedule rule can enable a set of rules during working hours.
      required:
        - type
        - ruleNumber
      properties:
        type:
          type: string
          const: enableRule
        ruleNumber:
          type: integer
          description: The rule to enable.
    DisableRuleAction:
      type: object
      description: Turn another rule off.
      required:
        - type
        - ruleNumber
      properties:
        type:
          type: string
          const: disableRule
        ruleNumber:
          type: integer
          description: The rule to disable.
    GetRulesAction:
      type: object
      description: >
        Ask the device to list its rules. The reply arrives as a device event like any other, so a
        rule can make the device report its own ruleset on a condition or a schedule — useful when a
        rule has been rewriting rules and you want to see where it got to.


        It is the one rule command a rule may fire. `createRule`, deleting a rule and clearing all
        rules are not available as actions: a ruleset that edits itself while it is being evaluated
        is the one shape the firmware cannot be reasoned about. Reading is safe because it changes
        nothing.
      required:
        - type
      properties:
        type:
          type: string
          const: getRules
    CreateIdAction:
      type: object
      description: >
        Create or replace an ID, exactly as `POST /devices/{serial}/ids` does — `id` is that call's
        body, unchanged. The device is reconfigured the moment the rule fires, so a rule can give
        itself the IO it needs.


        THE BODY IS NESTED RATHER THAN FLATTENED, and only here. An ID's body carries a `type` of
        its own — `digitalInput`, `momentaryOutput` and the rest — which would collide with the
        action's own `type` that the discriminator reads. Flattened, one field would have to mean
        two things.
      required:
        - type
        - id
      properties:
        type:
          type: string
          const: createId
        id:
          $ref: '#/components/schemas/IdCreate'
    DeleteIdAction:
      type: object
      description: Delete an ID, as `DELETE /devices/{serial}/ids/{idNumber}` does.
      required:
        - type
        - idNumber
      properties:
        type:
          type: string
          const: deleteId
        idNumber:
          type: integer
          description: The ID to delete.
    ClearIdsAction:
      type: object
      description: >
        Delete every ID on the device, as `DELETE /devices/{serial}/ids` does. `confirm` is required
        here for the same reason it is on the route: the call is unrecoverable and must not be
        reachable by accident.
      required:
        - type
        - confirm
      properties:
        type:
          type: string
          const: clearIds
        confirm:
          type: boolean
          enum:
            - true
    SetTimerAction:
      type: object
      description: >
        Drive an ID to a value for a fixed time, then revert, as `POST
        /devices/{serial}/ids/{idNumber}/timer` does.
      required:
        - type
        - idNumber
        - value
        - durationMs
      properties:
        type:
          type: string
          const: setTimer
        idNumber:
          type: integer
        value:
          $ref: '#/components/schemas/PinState'
        durationMs:
          type: integer
        revertState:
          $ref: '#/components/schemas/PinState'
    CancelTimerAction:
      type: object
      description: Cancel a pending timer on one ID.
      required:
        - type
        - idNumber
      properties:
        type:
          type: string
          const: cancelTimer
        idNumber:
          type: integer
    CancelAllTimersAction:
      type: object
      description: Cancel every pending timer on the device.
      required:
        - type
      properties:
        type:
          type: string
          const: cancelAllTimers
    RebootAction:
      type: object
      description: >
        Restart the device. A legitimate watchdog action — a rule that sees a condition it cannot
        recover from can restart the hardware.
      required:
        - type
      properties:
        type:
          type: string
          const: reboot
    AddTelemetryAction:
      type: object
      description: Register a telemetry sampler, as `POST /devices/{serial}/telemetry` does.
      required:
        - type
        - telemetryId
        - masterId
        - sampleRateMs
        - sampleSize
      properties:
        type:
          type: string
          const: addTelemetry
        telemetryId:
          type: integer
        masterId:
          type: integer
        sampleRateMs:
          type: integer
        sampleSize:
          type: integer
    RemoveTelemetryAction:
      type: object
      description: Remove a telemetry sampler.
      required:
        - type
        - telemetryId
      properties:
        type:
          type: string
          const: removeTelemetry
        telemetryId:
          type: integer
    SetTrackingAction:
      type: object
      description: >
        Start or stop position publishing, as `PUT /devices/{serial}/tracking` does. It never turns
        the GNSS receiver itself off.
      required:
        - type
      properties:
        type:
          type: string
          const: setTracking
        enabled:
          type: boolean
        intervalSeconds:
          type: integer
    Action:
      description: >
        A rule's `then`. Every rule type uses the same set, and so does an `interrupt` ID's
        `trigger`.
      oneOf:
        - $ref: '#/components/schemas/SetStateAction'
        - $ref: '#/components/schemas/EnableRuleAction'
        - $ref: '#/components/schemas/DisableRuleAction'
        - $ref: '#/components/schemas/GetRulesAction'
        - $ref: '#/components/schemas/CreateIdAction'
        - $ref: '#/components/schemas/DeleteIdAction'
        - $ref: '#/components/schemas/ClearIdsAction'
        - $ref: '#/components/schemas/SetTimerAction'
        - $ref: '#/components/schemas/CancelTimerAction'
        - $ref: '#/components/schemas/CancelAllTimersAction'
        - $ref: '#/components/schemas/RebootAction'
        - $ref: '#/components/schemas/AddTelemetryAction'
        - $ref: '#/components/schemas/RemoveTelemetryAction'
        - $ref: '#/components/schemas/SetTrackingAction'
      discriminator:
        propertyName: type
        mapping:
          setState: '#/components/schemas/SetStateAction'
          enableRule: '#/components/schemas/EnableRuleAction'
          disableRule: '#/components/schemas/DisableRuleAction'
          getRules: '#/components/schemas/GetRulesAction'
          createId: '#/components/schemas/CreateIdAction'
          deleteId: '#/components/schemas/DeleteIdAction'
          clearIds: '#/components/schemas/ClearIdsAction'
          setTimer: '#/components/schemas/SetTimerAction'
          cancelTimer: '#/components/schemas/CancelTimerAction'
          cancelAllTimers: '#/components/schemas/CancelAllTimersAction'
          reboot: '#/components/schemas/RebootAction'
          addTelemetry: '#/components/schemas/AddTelemetryAction'
          removeTelemetry: '#/components/schemas/RemoveTelemetryAction'
          setTracking: '#/components/schemas/SetTrackingAction'
    DigitalCondition:
      type: object
      description: Fires on the state of a digital ID — a door contact, a switch, a relay's feedback.
      required:
        - id
        - state
      properties:
        id:
          type: integer
          description: The ID to watch.
        state:
          type: string
          enum:
            - low
            - high
            - changed
          description: '`changed` fires on any transition, either direction.'
        forMs:
          type: integer
          default: 0
          description: >
            The state must hold this long before the rule fires. Use it to ignore contact bounce and
            brief glitches — with `500`, a contact that chatters as it closes only fires the rule
            once it has been steady for half a second, and each glitch resets the timer.


            **`forMs` must be at least the rule's `runIntervalMs`**, or the call is refused with
            `400 INVALID_FIELDS`. The rule is only CHECKED every `runIntervalMs`, so a shorter
            `forMs` describes a hold the device can never observe -- it would read as a debounce
            that silently does nothing.
    AnalogCondition:
      type: object
      description: |
        Fires on the value of an analog ID. **The most flexible rule type, and the one worth reading
        carefully:** `mode` decides whether `threshold` or `variance` is used, and the two behave
        very differently.

        · `above` — uses `threshold`. Fires when the value **crosses** above it.
        · `below` — uses `threshold`. Fires when the value **crosses** below it.
        · `changedByMoreThan` — uses `variance`. Fires when the value moves by at least that much
          since the previous evaluation, **in either direction** — `variance` is a size, not a
          direction.
        · `changed` — uses neither. Fires whenever the reading differs at all from the previous one.
          On a noisy input this fires almost every evaluation, so pair it with a slow
          `runIntervalMs`, or use `changedByMoreThan` with a small `variance` to ignore noise.

        **`above` and `below` are crossings, not levels.** The rule fires on the *transition* past
        the threshold, not repeatedly for as long as the value stays there. A reading already above
        `threshold` does not fire again until it has dropped back below and crossed up once more.

        One rule cannot both switch something on and off — use a matched pair with a gap between
        their thresholds so the output does not chatter around a single point.
      required:
        - id
        - mode
      properties:
        id:
          type: integer
          description: The ID to watch.
        mode:
          type: string
          enum:
            - above
            - below
            - changedByMoreThan
            - changed
        threshold:
          type: number
          description: >
            The level to compare against. **Required for `above` and `below`; ignored otherwise.**
            In the ID's reported units — for an analog ID, the real-world value derived from its
            `referenceMv` and `maxVoltage`, not raw counts.
        variance:
          type: number
          description: >
            The minimum jump between readings. **Required for `changedByMoreThan`; ignored
            otherwise.** In the ID's reported units, as `threshold` is.
        forMs:
          type: integer
          default: 0
          description: >
            The condition must hold this long before the rule fires.


            **Must be at least the rule's `runIntervalMs`**, or the call is refused with `400
            INVALID_FIELDS`. The rule is only CHECKED every `runIntervalMs`, so a shorter `forMs`
            describes a hold the device can never observe.
    ScheduleCondition:
      type: object
      description: >
        Fires on time rather than on a sensor. **All three constraints apply together:** the rule is
        active only within the date range, only within the daily time window, and only on the listed
        days. Outside them the rule stays loaded on the device but never fires.
      required:
        - startTime
        - endTime
      properties:
        startTime:
          type: string
          description: Daily window start, `HH:MM:SS`.
          example: '18:00:00'
        endTime:
          type: string
          description: Daily window end, `HH:MM:SS`.
          example: '22:30:00'
        daysOfWeek:
          type: array
          minItems: 1
          description: >
            Omit for every day. **An empty array is refused** with `400 INVALID_FIELDS`, rather than
            read as "every day": a rule that runs on no day at all is not something anyone means to
            ask for, and it would sit on the device looking configured and never fire. An
            unrecognised day name is refused too, by name.
          items:
            type: string
            enum:
              - sun
              - mon
              - tue
              - wed
              - thu
              - fri
              - sat
        startDate:
          type:
            - string
            - 'null'
          format: date
          description: >
            First date the rule is active, `YYYY-MM-DD`. Omit, or send `null`, to start immediately.


            **It must be a real calendar date, not merely the right shape.** `2027-13-45` matches
            the pattern and is refused with `400 INVALID_FIELDS`. So is an empty string: omitted
            means "no start date", and a value that cannot be read is not the same thing as one that
            was never sent, so the two must not compile to the same result.
        endDate:
          type:
            - string
            - 'null'
          format: date
          description: >
            Last date the rule is active, `YYYY-MM-DD`. Omit, or send `null`, and it never expires.
            Refused with `400 INVALID_FIELDS` if it is not a real calendar date -- see `startDate`.
    RuleCommon:
      type: object
      properties:
        name:
          type:
            - string
            - 'null'
          maxLength: 120
          description: >
            An optional label for this rule, for you and for anything that lists rules to a person.
            **Stored, never sent to the device** — the rule engine has no concept of a name, so this
            changes nothing about how the rule behaves. Without one, a rule can only be identified
            by its number, which is no help in a list of twenty.
        enabled:
          type: boolean
          default: true
          description: Whether the rule runs at all.
        runIntervalMs:
          type: integer
          minimum: 500
          default: 500
          description: >
            How often the rule is evaluated, in milliseconds. **Minimum 500** — a rule cannot be
            asked to run more often than twice a second. **Not continuous**: a signal shorter than
            this can pass unnoticed, and for events that short an `interrupt` ID is the right tool.
        onTrueJumpToRule:
          type: integer
          description: >
            Jump to this rule number when the condition is true. **Independent of `then`** — the
            rule can fire its action and jump on the same pass.
        onFalseJumpToRule:
          type: integer
          description: Jump to this rule number when the condition is false.
        then:
          $ref: '#/components/schemas/Action'
        timeoutMs:
          $ref: '#/components/schemas/TimeoutMs'
        requestId:
          $ref: '#/components/schemas/RequestId'
    DigitalRule:
      allOf:
        - type: object
          required:
            - type
            - if
            - then
          properties:
            type:
              type: string
              const: digital
            if:
              $ref: '#/components/schemas/DigitalCondition'
        - $ref: '#/components/schemas/RuleCommon'
    AnalogRule:
      allOf:
        - type: object
          required:
            - type
            - if
            - then
          properties:
            type:
              type: string
              const: analog
            if:
              $ref: '#/components/schemas/AnalogCondition'
        - $ref: '#/components/schemas/RuleCommon'
    ScheduleRule:
      allOf:
        - type: object
          required:
            - type
            - if
            - then
          properties:
            type:
              type: string
              const: schedule
            if:
              $ref: '#/components/schemas/ScheduleCondition'
        - $ref: '#/components/schemas/RuleCommon'
    RuleCreateEnvelope:
      type: object
      required:
        - ruleNumber
      properties:
        ruleNumber:
          type: integer
          minimum: 0
          description: >
            Unique rule number, and its position in the evaluation order. **Re-using a number
            replaces that rule.**
    CreateDigitalRule:
      allOf:
        - $ref: '#/components/schemas/RuleCreateEnvelope'
        - $ref: '#/components/schemas/DigitalRule'
    CreateAnalogRule:
      allOf:
        - $ref: '#/components/schemas/RuleCreateEnvelope'
        - $ref: '#/components/schemas/AnalogRule'
    CreateScheduleRule:
      allOf:
        - $ref: '#/components/schemas/RuleCreateEnvelope'
        - $ref: '#/components/schemas/ScheduleRule'
    RuleCreate:
      oneOf:
        - $ref: '#/components/schemas/CreateDigitalRule'
        - $ref: '#/components/schemas/CreateAnalogRule'
        - $ref: '#/components/schemas/CreateScheduleRule'
      discriminator:
        propertyName: type
        mapping:
          digital: '#/components/schemas/CreateDigitalRule'
          analog: '#/components/schemas/CreateAnalogRule'
          schedule: '#/components/schemas/CreateScheduleRule'
    Rule:
      allOf:
        - type: object
          required:
            - ruleNumber
            - type
            - enabled
          properties:
            ruleNumber:
              type: integer
            name:
              type:
                - string
                - 'null'
              description: The label given on create, or null.
            type:
              type:
                - string
                - 'null'
              enum:
                - digital
                - analog
                - schedule
                - device_copy
                - compare_and_run
                - analog_float
                - null
            enabled:
              type: boolean
            runIntervalMs:
              type:
                - integer
                - 'null'
            onTrueJumpToRule:
              type:
                - integer
                - 'null'
            onFalseJumpToRule:
              type:
                - integer
                - 'null'
            if:
              type: object
              additionalProperties: true
              description: The condition, in the shape its type defines.
            then:
              $ref: '#/components/schemas/Action'
    RuleConfigured:
      allOf:
        - $ref: '#/components/schemas/Confirmed'
        - type: object
          required:
            - ruleNumber
            - type
          properties:
            ruleNumber:
              type: integer
            type:
              type: string
              enum:
                - digital
                - analog
                - schedule
            result:
              type: string
              const: ok
    RuleEnabledChanged:
      allOf:
        - $ref: '#/components/schemas/Confirmed'
        - type: object
          required:
            - ruleNumber
            - enabled
          properties:
            ruleNumber:
              type: integer
            enabled:
              type: boolean
    Telemetry:
      type: object
      required:
        - telemetryId
        - masterId
        - sampleRateMs
        - sampleSize
      properties:
        telemetryId:
          type: integer
        masterId:
          type: integer
          description: The ID being sampled.
        sampleRateMs:
          type: integer
        sampleSize:
          type: integer
          maximum: 60
openapi: 3.1.0
info:
  title: Justworx API
  version: 2.5.0
  summary: Control and read Justworx devices.
  description: >
    One API for everything that touches a Justworx device — the same one our own apps use.


    ## Identity

    A device is addressed by its **serial**, the number printed on the unit. That is the only

    public device identifier. A device also has many **IDs** configured on it — each one a pin or

    a logical value, addressed by its number. `/devices/ABCD1234/ids/10` is entry 10 on unit

    ABCD1234. The two are unrelated; do not build a mapping layer between them.


    ## Reaching hardware


    **Waiting is the default.** Every write that reaches a device blocks until the device answers,

    then returns `200 status: confirmed` with the device's real state. If it stays silent you get

    `504 DEVICE_TIMEOUT`. Omitting `timeoutMs` does not mean "do not wait" — it means "wait the

    default 15 seconds".


    | `timeoutMs` | What happens |

    |---|---|

    | omitted | Wait 15000 ms. `200 confirmed`, or `504 DEVICE_TIMEOUT`. |

    | `0` | **Fire and forget.** Immediate `202 status: sent`. Never 504. |

    | `1`–`30000` | Wait that long. `200 confirmed`, or `504 DEVICE_TIMEOUT`. |


    Anything else is refused with `400 INVALID_FIELDS`.


    **A command an offline device never receives is discarded, not queued.** It will not run later

    when the device reconnects. This is a safety property: a gate-open command held for two hours

    and delivered later would open a gate with nobody there to expect it. A device already known to

    be offline fails immediately with `409 DEVICE_OFFLINE`, before anything is sent.


    **Reboot cannot confirm** — the device restarts before it can answer. Send `timeoutMs: 0`, or it

    returns `DEVICE_TIMEOUT` 15 seconds later even though the reboot succeeded.


    **One command per device per 500 ms.** Commands to the same device are queued and released at

    that rate — never dropped, and never refused with `429`. The first command to an idle device

    goes out immediately; the queue is unbounded and is per device, so work spread across devices

    does not contend.


    The consequence is worth planning for: with the default 15-second wait, roughly the **31st**

    command queued for one device times out with `504` while it is still waiting its turn, even

    though nothing is wrong with the device. Send a batch to one device sequentially, or send

    `timeoutMs: 0` and watch the event stream for the replies.


    ## Acting for another person


    **A device action taken through a third-party platform must be attributable to the person who

    took it.** So if you offer control of Justworx devices through Alexa, Google Home, Home

    Assistant, an MCP client or any other third party, **each of your end users must be a registered

    Justworx user**, and that user's own token must be the credential on the call.


    This is a legal requirement, not a convenience. An action carried out under your account's

    credential is attributed to *your account* — the audit trail can say a gate was opened, and by

    which integration, but not by whom. That is not a record we can stand behind, and not one you

    want to rely on either.


    **An API key cannot stand in for a person.** It names its owner and nothing else, so every
    action

    it takes belongs to that owner.


    **Nor can a share.** Sharing a device grants somebody the right to *operate* it, never to change

    what it is: IO configuration, rules, telemetry and tracking are owner-only and are not grantable

    at any control level. An end user holding a share cannot configure their own device.


    So there are two shapes, and they are a product decision rather than a technical one:


    · **You own the fleet.** Devices are claimed to your account and operated with your API key.
    Your
      customers reach them through *your* application, authenticated however you choose — we never
      see them, and no third-party platform is involved. Nothing here constrains you.

    · **Your customers own their devices.** Each is a registered Justworx user, claims their own
      device, and can then link Alexa, Google Home or any other platform to their own account. Every
      action is attributed to them.

    **We cannot strictly enforce this**, and we are telling you so rather than implying a control

    that does not exist. It is stated because the obligation is real whether or not a system checks

    it.


    ## Reading state


    **Prefer the twin.** `GET /devices/{serial}` returns liveness, every configured ID and its last

    known value, signal, carrier and location in one call. It never touches the device, works while

    the device is offline, cannot time out, and is the same record every other surface reads. Poll

    it freely.


    **The single-ID reads are not twin reads.** `GET /devices/{serial}/ids/{idNumber}` and

    `.../value` each ask the hardware and wait up to 15 seconds, so each can return `504` and each

    fails while the device is offline. They accept no `timeoutMs`. Both already read the device on

    every call. Use them when you need the pin sampled at this instant; use the twin for everything

    else, including anything on a loop.


    For live updates use the WebSocket at `/api/v2/stream` rather than polling.
  contact:
    name: Justworx
    url: https://justworx.com
  license:
    name: Proprietary
    url: https://justworx.com/terms
servers:
  - url: https://api.justworx.com/api/v2
    description: Production
security:
  - apiKey: []
  - oauth2: []
tags:
  - name: Devices
    description: The fleet, each device's canonical state, and what it did.
  - name: IDs
    description: What a device is configured to do. Nothing works until its IDs exist.
  - name: Values
    description: Reading and writing what an ID holds.
  - name: Rules
    description: Logic that runs on the device and survives losing the network.
  - name: Telemetry
    description: Sampling an ID at a fixed rate and uploading the readings in batches.
  - name: Location
    description: Where a device is, and where it has been.
  - name: Ownership
    description: Claiming, transferring and sharing a device.
  - name: Authoring
    description: Deploying a template's configuration onto a device.
  - name: Events
    description: |
      What a device tells you about itself, and choosing what it tells you.

      ## The real-time stream

      Two ways to receive events, carrying identical items and the same cursors -- picking one is
      purely a transport choice, never a difference in what you receive.

      **WebSocket — `wss://api.justworx.com/api/v2/stream`.** Preferred: lower latency (around
      110ms), one connection for every device you can reach. The protocol is below.

      **Long poll — `GET /events`.** The request ENDS, so it survives proxies that buffer a
      never-ending response, and it needs nothing but an HTTP client. Hold it open up to 90 seconds
      with `waitMs`; around 155ms once parked. Not only a fallback: the socket requires a `since`
      cursor on connect, and omitting it replays your entire account history rather than starting
      from now -- so a long-poll round always runs first, purely to obtain a cursor, even for a
      client that then moves to the socket for everything after.

      ### The WebSocket protocol

      1. **Connect** to `wss://api.justworx.com/api/v2/stream`. The socket is unauthenticated at
         this point and will send you nothing.
      2. **Send a subscribe frame first.** It is the only frame accepted from a new socket:

             { "type": "subscribe",
               "token": "jwx_live_…",     // or a user token; "Bearer " prefix optional
               "since": "<cursor>",        // optional. Omit to start from now.
               "serials": "ABCD1234,EFGH5678" }   // optional, comma-separated

         Any other first frame is refused with `{"error":"INVALID_FIELDS","detail":…}`, and a
         subscribe frame carrying no token with `{"error":"UNAUTHORIZED","detail":…}`. The socket
         stays open; send a correct frame and carry on.
      3. **Read event pages.** Each delivery is the same `EventPage` body `GET /events` returns —
         `{ items, cursor, hasMore }` — with the same `EventItem` shape. Keep the last `cursor`: it
         is what you send as `since` when you reconnect, and the socket mints none of its own.
      4. **Answer the heartbeat.** Every 30 seconds the server sends
         `{"type":"ping","ts":"<ISO-8601>"}`. Reply `{"type":"pong"}`. The heartbeat is not optional
         politeness — a quiet device produces no events for hours, and both the CDN (around 100
         seconds) and carrier NAT drop an idle socket, so a connection without it dies while looking
         healthy.
      5. **Reconnect with your last cursor** on any drop. Nothing is lost: the cursor marks an exact
         position, so no event is skipped or repeated. Never reconnect with `since: null` — that
         means *from the beginning of history*, not *from now*.

      Authentication, access and filtering are the same code path as `GET /events`, so a credential
      that can reach a device on one can reach it on the other, and neither shows you anything the
      other would not.
  - name: Account
    description: Who you are, and what you have called.
