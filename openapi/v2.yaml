paths:
  /me:
    patch:
      operationId: setMyName
      tags:
        - Account
      summary: Change your display name
      description: >
        Sets the name that appears in event sentences -- "Wayne opened the Main Gate".


        **Every user must have a name.** It is required at registration, and this route will not
        remove one: `null` is refused, and so are an empty string and whitespace. A name can be
        changed, never cleared.


        Where a user somehow has no name -- a record predating the rule, an import, corruption --
        event sentences fall back to their **email address** rather than to an anonymous label,
        because the email still identifies the person.
      security:
        - apiKey: []
        - oauth2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - displayName
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 60
                  description: >
                    Rendered inside a sentence in other people's feeds on a shared device, so
                    control characters and newlines are refused.
            example:
              displayName: Wayne
      responses:
        '200':
          description: The updated name.
          content:
            application/json:
              schema:
                type: object
                properties:
                  displayName:
                    type: string
              example:
                displayName: Wayne
        '400':
          description: |
            Blank, null, too long, not a string, or containing control characters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: INVALID_FIELDS
                detail: '''displayName'' must be a string in the request body for PATCH /me.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      operationId: whoAmI
      tags:
        - Account
      summary: Who this credential is
      description: >
        The account, the auth type, the acting person where a user token was used, and the scopes
        granted. Useful for confirming a token is what you think it is before debugging further.
      security:
        - apiKey: []
        - oauth2: []
      responses:
        '200':
          description: The caller.
          content:
            application/json:
              schema:
                type: object
                required:
                  - accountId
                  - authType
                  - scopes
                properties:
                  accountId:
                    type: string
                  authType:
                    type: string
                    enum:
                      - api_key
                      - oauth2
                  userId:
                    type:
                      - string
                      - 'null'
                    description: >
                      The acting person, when a user token was used. `null` for an API key — which
                      is exactly the difference between a log entry that names who opened a gate and
                      one that says only that your account did.
                  scopes:
                    type: array
                    items:
                      type: string
              example:
                accountId: 8f2c1a94-7d3e-4b21-9c05-6ea4e508e0de
                authType: api_key
                userId: null
                scopes:
                  - devices:read
                  - devices:command
                  - devices:configure
                  - devices:own
                  - events:read
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /devices/{serial}/load-template:
    parameters:
      - $ref: '#/components/parameters/Serial'
    post:
      operationId: loadTemplate
      tags:
        - Authoring
      summary: Apply a template to a device
      description: >
        Sends the commands that make the device's IDs and rules match the template, and updates its
        UI design to match. To move a device between versions of the template it already came from,
        use `POST /devices/{serial}/config` instead — that call knows which version it shipped with.
      security:
        - apiKey:
            - devices:configure
        - oauth2:
            - devices:configure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - templateId
              properties:
                templateId:
                  type: string
                version:
                  type:
                    - integer
                    - 'null'
                  description: Omit for the newest published version.
                timeoutMs:
                  $ref: '#/components/schemas/TimeoutMs'
                requestId:
                  $ref: '#/components/schemas/RequestId'
            example:
              templateId: tpl_7f31
              version: 5
      responses:
        '202':
          description: Sent.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sent'
                  - type: object
                    properties:
                      templateId:
                        type: string
                      templateVersion:
                        type:
                          - integer
                          - 'null'
                      commands:
                        type: integer
                        description: How many frames were sent to the device.
                      deploy:
                        type: object
                        properties:
                          lastDeployedAt:
                            type: string
                            format: date-time
                          templateVersion:
                            type:
                              - integer
                              - 'null'
              example:
                status: sent
                serial: ABCD1234
                templateId: tpl_7f31
                templateVersion: 5
                commands: 12
                deploy:
                  lastDeployedAt: '2026-09-18T09:42:03.000Z'
                  templateVersion: 5
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeviceOffline'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
  /devices:
    get:
      operationId: listDevices
      tags:
        - Devices
      summary: List your devices
      description: >
        Every device you own or have been shared, newest first. Each entry carries enough to render
        a list — name, serial, whether it is online and when it was last heard from — without a call
        per device.
      security:
        - apiKey:
            - devices:read
        - oauth2:
            - devices:read
      parameters:
        - name: online
          in: query
          description: Return only devices that are currently online, or only those that are not.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of devices.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - nextCursor
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DeviceSummary'
                  nextCursor:
                    $ref: '#/components/schemas/NextCursor'
              example:
                items:
                  - serial: ABCD1234
                    name: Main Gate Controller
                    online: true
                    lastSeenAt: '2026-08-13T09:41:58.000Z'
                    access: owner
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /devices/{serial}:
    parameters:
      - $ref: '#/components/parameters/Serial'
    get:
      operationId: getDevice
      tags:
        - Devices
      summary: Get a device's full state (the twin)
      description: |
        Every Justworx device has a **digital twin**: the platform's own record of everything it
        knows about that device — its configuration, every ID and that ID's last known value,
        connection state, signal, position.

        **The twin is the canonical source of truth**, and reading it is the cheapest thing you can
        do in this API:

        · It **never touches the device.** No command is sent, no airtime is used, no latency added.
        · It **works when the device is offline.** You still get its last known state, and you can
          see exactly how long ago that was.
        · It **cannot time out** — there is nothing to wait for.

        Poll it as often as you like. For anything other than "I need this pin's value at this
        precise instant", the twin is the right call — and it is also the call that resolves doubt
        when a stream event seems to contradict itself.
      security:
        - apiKey:
            - devices:read
        - oauth2:
            - devices:read
      responses:
        '200':
          description: The device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
              example:
                serial: ABCD1234
                name: Main Gate Controller
                online: true
                lastSeenAt: '2026-08-13T09:41:58.000Z'
                connection: cellular
                network:
                  carrier: Vodacom
                  signal: -71
                location:
                  latitude: -33.92487
                  longitude: 18.42406
                  at: '2026-08-13T09:41:12.000Z'
                ids:
                  - idNumber: 1
                    type: digitalOutput
                    pin: 10
                    value: low
                    at: '2026-08-13T09:41:55.000Z'
                  - idNumber: 7
                    type: digitalInput
                    pin: 7
                    value: high
                    at: '2026-08-13T09:41:57.000Z'
                  - idNumber: 14
                    type: analogInput
                    pin: 14
                    value: 23.6
                    at: '2026-08-13T09:41:50.000Z'
                  - idNumber: 20
                    type: momentaryOutput
                    pin: 20
                    value: low
                    at: '2026-08-13T09:38:02.000Z'
                  - idNumber: 74
                    type: textVariable
                    value: tank full
                    at: '2026-08-13T08:02:14.000Z'
                rules:
                  - ruleNumber: 1
                    type: digital
                    enabled: true
                  - ruleNumber: 2
                    type: analog
                    enabled: true
                at: '2026-08-13T09:42:03.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      operationId: updateDevice
      tags:
        - Devices
      summary: Rename a device
      description: Changes only how the device is labelled. Nothing is sent to the hardware.
      security:
        - apiKey:
            - devices:configure
        - oauth2:
            - devices:configure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 120
            example:
              name: Main Gate Controller
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceSummary'
              example:
                serial: ABCD1234
                name: Main Gate Controller
                online: true
                lastSeenAt: '2026-09-18T09:41:58.000Z'
                access: owner
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /devices/{serial}/reboot:
    parameters:
      - $ref: '#/components/parameters/Serial'
    post:
      operationId: rebootDevice
      tags:
        - Devices
      summary: Restart a device
      description: |
        Restarts the device immediately.

        > **This is the one call that never waits.** The device restarts the moment it receives the
        > command, so there is nothing left to answer with — and rather than leave that to the
        > caller, the route does not accept `timeoutMs` at all and always answers `202`. You cannot
        > ask this call to confirm, and you cannot accidentally make it hang.

        IDs and rules survive a reboot; they are stored on the device. A reboot does not reset
        configuration — for that, remove the IDs or clear the rules.

        The device typically reappears within 30–60 seconds. Watch for it by polling any call until
        it stops answering `DEVICE_OFFLINE`.
      security:
        - apiKey:
            - devices:command
        - oauth2:
            - devices:command
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                requestId:
                  $ref: '#/components/schemas/RequestId'
            example:
              requestId: restart-after-config
      responses:
        '202':
          description: Reboot command sent. This is the only success status this route returns.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sent'
              example:
                status: sent
                serial: ABCD1234
                requestId: restart-after-config
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeviceOffline'
        '500':
          $ref: '#/components/responses/ServerError'
  /devices/{serial}/timers:
    parameters:
      - $ref: '#/components/parameters/Serial'
    delete:
      operationId: cancelAllTimers
      tags:
        - Values
      summary: Cancel every pending timer
      description: >
        Cancels every running timer on the device at once — every `momentaryOutput` timer,
        `delayedOutput` wait and one-off timed set currently in flight. Each affected pin is
        restored to the value it held immediately before its timer was triggered. Rules are not
        affected.
      security:
        - apiKey:
            - devices:command
        - oauth2:
            - devices:command
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                timeoutMs:
                  $ref: '#/components/schemas/TimeoutMs'
                requestId:
                  $ref: '#/components/schemas/RequestId'
            example:
              timeoutMs: 0
              requestId: cancel-all
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Confirmed'
                  - type: object
                    required:
                      - cancelled
                    properties:
                      cancelled:
                        type: integer
                        description: How many timers were cancelled.
              example:
                status: confirmed
                serial: ABCD1234
                requestId: cancel-all
                cancelled: 2
                at: '2026-08-12T14:03:11.200Z'
        '202':
          description: Sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeviceOffline'
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/DeviceTimeout'
  /devices/{serial}/log:
    parameters:
      - $ref: '#/components/parameters/Serial'
    get:
      operationId: getDeviceLog
      tags:
        - Devices
      summary: A device's history, newest first
      description: |
        Every message between the platform and a device is recorded — commands sent, replies
        received, values reported, connections lost and regained. **The log is the record of what
        actually happened, where the twin is only the record of where things ended up.**

        Reach for it when the twin alone does not answer the question: why a value changed when
        nobody asked it to, whether a command was really delivered, how long a device has been
        dropping in and out, what it was doing before it went offline.

        Like the twin this reads stored data — no command is sent, no airtime is used, and it works
        for an offline device.

        **Entries are kept for 365 days**, then archived on a per-day FIFO basis automatically.

        **Correlating with your own requests.** Entries created by something you sent carry the
        `requestId` you used, so you can follow a single action all the way through. Entries the
        device raised on its own have **no** `requestId`, which is itself informative: if a value
        changed and the log shows no `requestId` against it, nothing you sent caused it.
      security:
        - apiKey:
            - events:read
        - oauth2:
            - events:read
      parameters:
        - name: from
          in: query
          schema:
            type: string
            format: date-time
          description: Only entries at or after this time. ISO 8601. Defaults to 24 hours ago.
        - name: to
          in: query
          schema:
            type: string
            format: date-time
          description: Only entries at or before this time. ISO 8601. Defaults to now.
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/LogEntryType'
          description: Only entries of this type.
        - name: idNumber
          in: query
          schema:
            type: integer
            minimum: 0
          description: Only entries involving this ID.
        - name: ruleNumber
          in: query
          schema:
            type: integer
            minimum: 0
          description: >-
            Only entries involving this rule — what it was configured to do, and every time it
            fired.
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of entries. If `nextCursor` is present there are more; pass it back as `cursor`.
          content:
            application/json:
              schema:
                type: object
                required:
                  - serial
                  - items
                  - nextCursor
                properties:
                  serial:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LogEntry'
                  nextCursor:
                    $ref: '#/components/schemas/NextCursor'
                  at:
                    type: string
                    format: date-time
              example:
                serial: ABCD1234
                items:
                  - at: '2026-08-13T09:41:57.000Z'
                    type: value_reported
                    category: state
                    idNumber: 20
                    value: low
                  - at: '2026-08-13T09:41:54.000Z'
                    type: value_written
                    category: action
                    idNumber: 20
                    value: high
                    requestId: open-gate
                  - at: '2026-08-13T09:12:08.000Z'
                    type: device_online
                    category: connection
                nextCursor: MjAyNi0wOC0xM1QwOToxMjowOC4wMDBafGxvZ18wMDQ3
                at: '2026-08-13T09:42:03.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /devices/{serial}/log/archive:
    parameters:
      - $ref: '#/components/parameters/Serial'
    get:
      operationId: getDeviceLogArchive
      tags:
        - Devices
      summary: Entries older than 365 days
      description: >
        Retrieves the archived portion, which the live log does not return. Archived per day, so
        `day` is required. Slower than the live log and intended for occasional retrieval rather
        than routine reads.
      security:
        - apiKey:
            - events:read
        - oauth2:
            - events:read
      parameters:
        - name: day
          in: query
          required: true
          schema:
            type: string
            format: date
          example: '2026-09-17'
          description: The day to retrieve, `YYYY-MM-DD`.
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of archived entries.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - nextCursor
                properties:
                  serial:
                    type: string
                  day:
                    type: string
                    format: date
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/LogEntry'
                  nextCursor:
                    $ref: '#/components/schemas/NextCursor'
              example:
                serial: ABCD1234
                day: '2026-09-17'
                items:
                  - at: '2026-09-17T09:41:57.000Z'
                    type: value_reported
                    ids:
                      - idNumber: 14
                        value: '2204'
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Nothing archived for that day.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: NOT_FOUND
                detail: Nothing is archived for 2026-09-17.
                serial: ABCD1234
        '500':
          $ref: '#/components/responses/ServerError'
  /events:
    get:
      operationId: tailEvents
      tags:
        - Events
      summary: Long-poll the event tail
      description: >
        Returns events after your cursor, or holds the connection open until one arrives. This is a
        pull channel that behaves like a push one: the request ENDS, so it survives proxies that
        buffer a never-ending response.


        Pass the `cursor` from the previous response back as `since`. Omit it on the first call to
        start from now. `waitMs: 0` returns immediately with whatever is already there.


        The field is `cursor`, not `nextCursor`. `nextCursor` is the paging field on `GET
        /devices/{serial}/log`, which is a different surface with a different shape.


        The same events are available over a WebSocket at `wss://api.justworx.com/api/v2/stream`,
        carrying identical items and the same cursors. It is not an HTTP path, so it has no
        operation here -- its protocol is documented in full under the Events tag.
      security:
        - apiKey: []
        - oauth2: []
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: string
          description: The `cursor` from your previous response. Opaque; do not construct one.
        - name: waitMs
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 90000
          description: How long to hold the request if nothing has happened. 0 does not wait.
        - name: serials
          in: query
          required: false
          schema:
            type: string
          description: Comma-separated serials to restrict the tail to devices you can reach.
      responses:
        '200':
          description: Events after your cursor, possibly none.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
              example:
                items:
                  - cursor: MjAyNi0wOS0xOFQwOTo0MTo1Ny4wMDBafGxvZ18wMDQ3
                    ts: '2026-09-18T09:41:57.000Z'
                    type: activity
                    kind: device
                    event: value_reported
                    serial: ABCD1234
                    message: Battery Voltage updated to 8.29
                    actor: null
                    channel: log
                    data:
                      id: 14
                      value: '8.29'
                  - cursor: MjAyNi0wOS0xOFQwOTo0MTo1NC4wMDBafGxvZ18wMDQ2
                    ts: '2026-09-18T09:41:54.000Z'
                    type: activity
                    kind: action
                    event: set_value
                    serial: ABCD1234
                    message: Main Gate was activated by Wayne
                    actor:
                      userId: 8f2c1a94-7d3e-4b21-9c05-6ea4e508e0de
                      name: Wayne
                      surface: app
                    channel: log
                    data:
                      id: 10
                      requested: high
                  - cursor: MjAyNi0wOS0xOFQwOToxMjowOC4wMDBafGxvZ18wMDQ1
                    ts: '2026-09-18T09:12:08.000Z'
                    type: status
                    kind: presence
                    event: device_online
                    serial: ABCD1234
                    message: null
                    actor: null
                    channel: log
                    data: '{}'
                cursor: MjAyNi0wOS0xOFQwOToxMjowOC4wMDBafGxvZ18wMDQ1
                hasMore: false
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'
  /devices/{serial}/events:
    parameters:
      - $ref: '#/components/parameters/Serial'
    get:
      operationId: getDeviceEventSettings
      tags:
        - Events
      summary: This device's event settings
      description: |
        The effective event settings for one device: what the product decided, and any override you
        have applied on top. Owner only — a share, even with full control, does not reach this.

        > **This is not where an IO's notifications come from.** Those are the `states` list on the
        > ID — a comparison, a `sentence`, and whether it logs, pushes or both. This surface covers
        > the events that belong to no IO: configuration events, and the device coming online and
        > going offline.

        Each entry carries the resolved values, a `productDefault` so a client can offer "reset to
        the product default", `overridden` naming the fields you have changed, and
        `ownerOverridable` saying whether this event may be changed at all.

        `type` is the product's classification and is shown for context only; it cannot be changed.
      security:
        - oauth2: []
      responses:
        '200':
          description: The effective settings, product defaults included.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceEventSettings'
              example:
                serial: ABCD1234
                count: 1
                events:
                  - key: value_reported#39
                    enabled: true
                    type: activity
                    channel: log
                    ownerOverridable: true
                    overridden:
                      - channel
                    productDefault:
                      enabled: true
                      channel: push
                note: type is set by the product and cannot be overridden
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No device with that serial, or you are not its owner.
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      operationId: setDeviceEventOverrides
      tags:
        - Events
      summary: Override this device's event settings
      description: |
        Replaces your override layer for this device. Send the complete set you want to keep —
        a key you omit reverts to the product default.

        > **To change what one of this device's IOs says, edit that ID's `states` instead.** Each
        > entry there is a comparison, a `sentence` and a channel, and that is what composes an IO
        > notification.

        You may set `enabled` and `channel`. You may not set `type`, and you may not raise
        `channel` to `push` on an event whose type does not allow pushing: both are the product's
        decision and both are refused with 400 rather than ignored.

        A `400` also covers an unknown key or field, and an event the product does not allow an
        owner to override.

        These overrides live on the device and are NOT cleared by a template version update.
      security:
        - oauth2: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceEventOverrides'
            example:
              events:
                value_reported#39:
                  enabled: true
                  channel: log
      responses:
        '200':
          description: The stored override layer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceEventOverrideResult'
              example:
                serial: ABCD1234
                overrides: 1
                events:
                  value_reported#39:
                    enabled: true
                    channel: log
                note: stored on the device. A template version update does not clear these.
        '400':
          description: Refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: INVALID_FIELDS
                detail: 'value_reported#39.verb is not an overridable field. Allowed: enabled, channel'
                serial: ABCD1234
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No device with that serial, or you are not its owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: NOT_FOUND
                detail: No device with that serial, or you are not its owner.
                serial: ABCD1234
        '500':
          $ref: '#/components/responses/ServerError'
  /devices/{serial}/ids:
    parameters:
      - $ref: '#/components/parameters/Serial'
    get:
      operationId: listIds
      tags:
        - IDs
      summary: List every configured ID
      description: >
        Every ID on the device with its type, configuration and current value. This is the call for
        finding out what a device actually looks like — during commissioning, or to reconcile one
        against what you expect it to be. It is also the call to make when a `404 ID_NOT_CONFIGURED`
        was unexpected.
      security:
        - apiKey:
            - devices:read
        - oauth2:
            - devices:read
      responses:
        '200':
          description: The device's configured IDs.
          content:
            application/json:
              schema:
                type: object
                required:
                  - serial
                  - items
                properties:
                  serial:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/IdState'
                  at:
                    type: string
                    format: date-time
              example:
                serial: ABCD1234
                items:
                  - idNumber: 1
                    type: digitalOutput
                    pin: 10
                    bootState: low
                    value: low
                  - idNumber: 7
                    type: digitalInput
                    pin: 7
                    updateMs: 1000
                    value: high
                  - idNumber: 14
                    type: analogInput
                    pin: 14
                    referenceMv: 3300
                    maxVoltage: 3.3
                    value: 2.54
                  - idNumber: 74
                    type: textVariable
                    value: tank full
                at: '2026-08-12T14:03:11.200Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createId
      tags:
        - IDs
      summary: Create or replace an ID
      description: |
        **Start here. Nothing else in this API works until IDs are configured.**

        A device's ID list *is* its configuration. Each ID either sets up one of the device's
        physical pins — what it is, how it behaves, how often it reports, how it times — or defines
        a value the device stores or computes on its own. A pin with no ID against it does nothing
        and cannot be read or driven.

        Creating an ID **configures** the device. It does not read a value or change one.

        **Re-using an existing `idNumber` replaces that ID's configuration**, so this is create and
        replace in one call.

        A freshly manufactured device is already configured from its product template, so in normal
        use you are adding to that rather than starting from nothing.
      security:
        - apiKey:
            - devices:configure
        - oauth2:
            - devices:configure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdCreate'
            examples:
              digitalInput:
                summary: A door contact on pin 7
                value:
                  requestId: cfg-door-sensor
                  timeoutMs: 5000
                  idNumber: 7
                  type: digitalInput
                  pin: 7
                  updateMs: 1000
                  updateMode: onChange
              digitalOutput:
                summary: A gate relay that must NOT energise on power-up
                value:
                  requestId: cfg-gate-relay
                  timeoutMs: 5000
                  idNumber: 1
                  type: digitalOutput
                  pin: 10
                  bootState: low
              analogInput:
                summary: A 3.3 V sensor on a 1:1 divider, reported in volts
                value:
                  requestId: cfg-tank-level
                  timeoutMs: 5000
                  idNumber: 14
                  type: analogInput
                  pin: 14
                  referenceMv: 3300
                  maxVoltage: 3.3
                  updateMs: 5000
                  updateMode: onChange
              interrupt:
                summary: A flow-meter pulse too short for any polling interval to catch
                value:
                  requestId: cfg-flow-meter
                  timeoutMs: 5000
                  idNumber: 20
                  type: interrupt
                  pin: 5
                  edge: rising
                  pinMode: inputPullup
                  intervalMs: 50
                  trigger:
                    type: setState
                    io: 11
                    state: high
              momentaryOutput:
                summary: A 3-second gate trigger that releases itself
                value:
                  requestId: cfg-gate-trigger
                  timeoutMs: 5000
                  idNumber: 20
                  type: momentaryOutput
                  pin: 20
                  bootState: low
                  triggerState: high
                  durationMs: 3000
                  revertState: low
              delayedOutput:
                summary: A pump that may not restart for 30 seconds
                value:
                  requestId: cfg-pump-delay
                  timeoutMs: 5000
                  idNumber: 21
                  type: delayedOutput
                  pin: 21
                  bootState: low
                  delayMs: 30000
                  state: high
              textVariable:
                summary: A string the device holds and hands out on its own
                value:
                  requestId: cfg-display-msg
                  timeoutMs: 5000
                  idNumber: 74
                  type: textVariable
                  text: hello world
              math2xId:
                summary: Power, computed on the device from voltage and current
                value:
                  requestId: cfg-power-calc
                  timeoutMs: 5000
                  idNumber: 60
                  type: math2xId
                  id1: 10
                  operator: '*'
                  id2: 11
                  updateMs: 1000
      responses:
        '200':
          description: The device confirmed. The body echoes the configuration it accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdConfigured'
              example:
                status: confirmed
                serial: ABCD1234
                requestId: cfg-gate-relay
                idNumber: 1
                type: digitalOutput
                pin: 10
                bootState: low
                result: ok
                at: '2026-08-12T14:03:11.200Z'
        '202':
          description: Sent. No confirmation was requested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeviceOffline'
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/DeviceTimeout'
    delete:
      operationId: clearIds
      tags:
        - IDs
      summary: Remove every ID
      description: >
        **Destructive.** Removes the device's entire configuration. The device keeps running and
        stays connected, but controls nothing and reports nothing until it is reconfigured. Requires
        `confirm: true`.
      security:
        - apiKey:
            - devices:configure
        - oauth2:
            - devices:configure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - confirm
              properties:
                confirm:
                  $ref: '#/components/schemas/Confirm'
                timeoutMs:
                  $ref: '#/components/schemas/TimeoutMs'
                requestId:
                  $ref: '#/components/schemas/RequestId'
            example:
              requestId: factory-wipe
              timeoutMs: 5000
              confirm: true
      responses:
        '200':
          description: Cleared.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Confirmed'
                  - type: object
                    required:
                      - cleared
                    properties:
                      cleared:
                        type: integer
                        description: How many IDs were removed.
                      result:
                        type: string
                        const: ok
              example:
                status: confirmed
                serial: ABCD1234
                requestId: factory-wipe
                cleared: 12
                result: ok
                at: '2026-08-12T14:03:11.200Z'
        '202':
          description: Sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/DeviceTimeout'
  /devices/{serial}/ids/{idNumber}:
    parameters:
      - $ref: '#/components/parameters/Serial'
      - $ref: '#/components/parameters/IdNumber'
    get:
      operationId: getId
      tags:
        - IDs
      summary: Get one ID's configuration
      security:
        - apiKey:
            - devices:read
        - oauth2:
            - devices:read
      responses:
        '200':
          description: The ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdState'
              example:
                idNumber: 14
                type: analogInput
                pin: 14
                updateMs: 5000
                updateMode: onChange
                referenceMv: 3300
                maxVoltage: 3.3
                name: Battery Voltage
                stateKeywords: null
                states:
                  - when:
                      op: lt
                      value: 11.5
                    sentence: Low battery on {deviceName}
                    channel: both
                    alert: true
                showActor: false
                linkedIo: null
                value: 2204
                at: '2026-09-18T09:41:50.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
    delete:
      operationId: deleteId
      tags:
        - IDs
      summary: Remove one ID
      description: >
        **Any rule that references a removed ID will stop working.** Check the device's rules first
        — the device will not warn you.
      security:
        - apiKey:
            - devices:configure
        - oauth2:
            - devices:configure
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                timeoutMs:
                  $ref: '#/components/schemas/TimeoutMs'
                requestId:
                  $ref: '#/components/schemas/RequestId'
            example:
              timeoutMs: 0
              requestId: remove-io-10
      responses:
        '200':
          description: The device confirmed the removal.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Confirmed'
                  - type: object
                    properties:
                      idNumber:
                        type: integer
              example:
                status: confirmed
                serial: ABCD1234
                idNumber: 10
                at: '2026-08-12T14:03:11.200Z'
        '202':
          description: 'Sent. You asked not to wait, with `timeoutMs: 0`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeviceOffline'
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/DeviceTimeout'
  /devices/{serial}/ids/{idNumber}/value:
    parameters:
      - $ref: '#/components/parameters/Serial'
      - $ref: '#/components/parameters/IdNumber'
    get:
      operationId: getIdValue
      tags:
        - Values
      summary: Read an ID's value
      description: |
        Returns the value the device captured on its last pass, respecting the ID's configured
        `updateMs`.

        **To read several IDs, read the twin** — `GET /devices/{serial}` returns every configured ID
        and its value in one call, which is both fewer requests and the recommended path.

        The device samples the pin fresh on every call. An analog ID's value comes back in its
        real-world units, derived from its `referenceMv` and `maxVoltage`. An ID with neither is
        uncalibrated and reports raw millivolts.
      security:
        - apiKey:
            - devices:read
        - oauth2:
            - devices:read
      responses:
        '200':
          description: The value.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IdValue'
              example:
                idNumber: 14
                type: analogInput
                value: 23.6
                at: '2026-08-12T14:03:11.200Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/DeviceTimeout'
    put:
      operationId: setIdValue
      tags:
        - Values
      summary: Write a value
      description: |
        Sets a `textVariable`, or drives an output by value.

        **On `momentaryOutput` and `delayedOutput` a write is what *fires* them** — the value you
        send is ignored, and the timer or delay configured on the ID is what runs.

        `force: true` drives the ID **outside the boundaries its configuration sets** and holds it,
        ignoring any timer or delay behaviour the ID would normally impose. The worked case: an ID
        configured to run for 3000 ms, which you need held for 30 seconds just this once. While a
        `momentaryOutput` timer runs a forced write is also the emergency stop — it takes the pin
        immediately and cancels the pending revert.

        If you find yourself forcing the same override repeatedly, the ID's configuration is wrong
        for your use case. Reconfigure it rather than working around it on every call.

        **On a `200`, `value` is the state the device reports *after* the write — its real state,
        not an echo of what you asked for.** Compare the two if you need to be certain the hardware
        did what you intended.
      security:
        - apiKey:
            - devices:command
        - oauth2:
            - devices:command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - value
              properties:
                value:
                  type:
                    - number
                    - string
                  description: >
                    The value to write. Digital IDs take `"high"` or `"low"`; `analogInput` takes a
                    number; `textVariable` takes a string. Ignored on `momentaryOutput` and
                    `delayedOutput`, where any write fires the configured behaviour.
                force:
                  type: boolean
                  default: false
                  description: |
                    Drive the ID directly and hold it, bypassing its configured timer or delay.
                timeoutMs:
                  $ref: '#/components/schemas/TimeoutMs'
                requestId:
                  $ref: '#/components/schemas/RequestId'
            examples:
              text:
                summary: Set a stored string
                value:
                  requestId: set-display
                  timeoutMs: 5000
                  value: tank full
              forced:
                summary: Hold an output past its configured timer
                value:
                  requestId: open-gate
                  timeoutMs: 5000
                  value: high
                  force: true
      responses:
        '200':
          description: The device confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValueWritten'
              example:
                status: confirmed
                serial: ABCD1234
                requestId: open-gate
                idNumber: 1
                value: high
                at: '2026-08-12T14:03:11.200Z'
        '202':
          description: Sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeviceOffline'
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/DeviceTimeout'
  /devices/{serial}/ids/{idNumber}/timer:
    parameters:
      - $ref: '#/components/parameters/Serial'
      - $ref: '#/components/parameters/IdNumber'
    post:
      operationId: startIdTimer
      tags:
        - Values
      summary: Drive for a fixed time, then revert
      description: >
        Drives an ID for a fixed time and reverts it automatically, without needing a second call.
        **The device runs the timer itself, so the revert still happens if the network drops in
        between** — which is why this exists rather than having you write, wait, and write back.


        It also overrides a `momentaryOutput`'s configured duration for one shot, leaving the ID's
        configuration untouched for every trigger after it.


        The response confirms the timer **started**. Cancel it before it completes with `DELETE
        /devices/{serial}/ids/{idNumber}/timer`.
      security:
        - apiKey:
            - devices:command
        - oauth2:
            - devices:command
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - value
                - durationMs
              properties:
                value:
                  $ref: '#/components/schemas/PinState'
                  description: The state to hold while the timer runs.
                durationMs:
                  type: integer
                  minimum: 1
                  description: How long to hold it, in milliseconds.
                revertState:
                  allOf:
                    - $ref: '#/components/schemas/PinState'
                  default: low
                  description: The state to return to afterwards.
                timeoutMs:
                  $ref: '#/components/schemas/TimeoutMs'
                requestId:
                  $ref: '#/components/schemas/RequestId'
            example:
              requestId: timer-gate
              timeoutMs: 5000
              value: high
              durationMs: 5000
              revertState: low
      responses:
        '200':
          description: The timer started.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Confirmed'
                  - type: object
                    required:
                      - idNumber
                    properties:
                      idNumber:
                        type: integer
                      value:
                        $ref: '#/components/schemas/PinState'
                      revertsInMs:
                        type: integer
                        description: How long until the device reverts the pin.
              example:
                status: confirmed
                serial: ABCD1234
                requestId: timer-gate
                idNumber: 10
                value: high
                revertsInMs: 5000
                at: '2026-08-12T14:03:11.200Z'
        '202':
          description: Sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeviceOffline'
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/DeviceTimeout'
    delete:
      operationId: cancelIdTimer
      tags:
        - Values
      summary: Cancel a pending timer on this ID
      description: >
        Cancels a `momentaryOutput` timer, a `delayedOutput` wait, or a one-off timed force-set.


        **The pin is restored to the value it held immediately before the timer was triggered** —
        not the timer's configured revert value, and not something you have to know or supply. If
        the timer had been re-triggered several times, the value restored is the one from before the
        *first* trigger in that chain.


        This cancels device timers only; rules are not affected.
      security:
        - apiKey:
            - devices:command
        - oauth2:
            - devices:command
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                timeoutMs:
                  $ref: '#/components/schemas/TimeoutMs'
                requestId:
                  $ref: '#/components/schemas/RequestId'
            example:
              timeoutMs: 5000
              requestId: cancel-gate-timer
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Confirmed'
                  - type: object
                    required:
                      - idNumber
                      - restoredTo
                    properties:
                      idNumber:
                        type: integer
                      restoredTo:
                        oneOf:
                          - $ref: '#/components/schemas/PinState'
                          - type: 'null'
                        description: >
                          The value the pin was returned to. **`null` means the ID exists but had no
                          timer pending** — nothing was cancelled and nothing changed, which is a
                          success, not an error.
              example:
                status: confirmed
                serial: ABCD1234
                requestId: abort-timer
                idNumber: 20
                restoredTo: low
                at: '2026-08-12T14:03:11.200Z'
        '202':
          description: Sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeviceOffline'
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/DeviceTimeout'
  /devices/{serial}/location:
    parameters:
      - $ref: '#/components/parameters/Serial'
    put:
      operationId: setInstalledLocation
      tags:
        - Location
      summary: Set where a device is installed
      description: >
        Not every device has a GNSS receiver. This records where one **is**, for the devices that
        cannot say so themselves.


        **A device that reports its own position always wins.** Setting this on a device with a GNSS
        fix stores the value but does not use it — `effective` in the response tells you which one
        is in force. The two are kept separately so a device that later gains a fix needs no
        correction.


        **Owner only.** A share grants use of a device, not the authority to say where it is — a
        wrong installed location would follow the device for everyone using it.


        Send `{"clear": true}` to remove it. Clearing is explicit rather than an empty body, so a
        client that omits its coordinates gets a `400` instead of silently erasing a position
        someone set deliberately.
      security:
        - oauth2:
            - devices:configure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required:
                    - lat
                    - lon
                  properties:
                    lat:
                      type: number
                      minimum: -90
                      maximum: 90
                    lon:
                      type: number
                      minimum: -180
                      maximum: 180
                    place:
                      type:
                        - string
                        - 'null'
                      maxLength: 200
                - type: object
                  additionalProperties: false
                  required:
                    - clear
                  properties:
                    clear:
                      type: boolean
                      enum:
                        - true
            examples:
              set:
                summary: Record where a device is installed
                value:
                  lat: -33.92487
                  lon: 18.42406
                  place: Main gate, Constantia
              clear:
                summary: Remove it again
                value:
                  clear: true
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                type: object
                required:
                  - serial
                properties:
                  serial:
                    type: string
                    minLength: 1
                    maxLength: 64
                    example: ABCD1234
                    description: The device's serial.
                  installedLocation:
                    type:
                      - object
                      - 'null'
                    properties:
                      lat:
                        type: number
                      lon:
                        type: number
                      place:
                        type:
                          - string
                          - 'null'
                      source:
                        type: string
                        enum:
                          - installed
                      setAt:
                        type: string
                        format: date-time
                  effective:
                    type: string
                    enum:
                      - installed
                      - device-reported
                    description: Which position is actually in use for this device.
                  note:
                    type: string
                  cleared:
                    type: boolean
              example:
                serial: ABCD1234
                installedLocation:
                  lat: -33.92487
                  lon: 18.42406
                  place: Main gate, Constantia
                  source: installed
                  setAt: '2026-09-18T09:30:00.000Z'
                effective: device-reported
                note: >-
                  This device reports its own position, which takes precedence. The installed
                  location is kept as a fallback.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    get:
      operationId: getLocation
      tags:
        - Location
      summary: Current position
      description: |
        The device's last known position, or `null` if it has never acquired a fix.

        > **An absent position means *no fix yet*, never *at the equator*.** A device that has not
        > acquired a fix reports its other status normally with the position left empty, rather than
        > reporting a stale or zeroed coordinate.

        Acquiring a first fix takes anywhere from around 30 seconds to several minutes, and may
        never complete without a view of the sky. A device indoors or underground will report
        carrier and signal but no position, indefinitely and correctly.
      security:
        - apiKey:
            - devices:read
        - oauth2:
            - devices:read
      responses:
        '200':
          description: Position, or `null` if never fixed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/Position'
                  - type: 'null'
              example:
                latitude: -33.92487
                longitude: 18.42406
                at: '2026-09-18T09:41:12.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /devices/{serial}/track:
    parameters:
      - $ref: '#/components/parameters/Serial'
    get:
      operationId: getTrack
      tags:
        - Location
      summary: Position history
      description: >
        The trail of positions, **oldest first**, over a time window.


        **Each point carries the time the fix was *taken*, not when it reached us.** A device that
        buffers fixes through a coverage gap and uploads them on reconnect still plots along the
        route it actually drove, rather than every point landing at the moment of upload.
      security:
        - apiKey:
            - devices:read
        - oauth2:
            - devices:read
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date-time
          description: Window start, ISO 8601.
        - name: until
          in: query
          schema:
            type: string
            format: date-time
          description: Window end, ISO 8601.
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of positions, oldest first.
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - nextCursor
                properties:
                  serial:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrackPoint'
                  nextCursor:
                    $ref: '#/components/schemas/NextCursor'
              example:
                serial: ABCD1234
                items:
                  - latitude: -33.92487
                    longitude: 18.42406
                    at: '2026-09-18T09:41:12.000Z'
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /devices/{serial}/tracking:
    parameters:
      - $ref: '#/components/parameters/Serial'
    get:
      operationId: getTracking
      tags:
        - Location
      summary: Read live tracking settings
      description: >
        Reading and writing are separate methods on this resource — a `GET` reads and a `PUT`
        writes, with no overloading of one call to do both.
      security:
        - apiKey:
            - devices:read
        - oauth2:
            - devices:read
      responses:
        '200':
          description: The current settings.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tracking'
              example:
                enabled: true
                intervalSeconds: 60
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      operationId: setTracking
      tags:
        - Location
      summary: Turn continuous tracking on or off
      description: >
        Turns on **continuous tracking**. Instead of the position that arrives with the device's

        regular status, the device reads its position on an interval and publishes each fresh fix as

        it happens — built for vehicles and moving assets rather than knowing where an installed

        device sits.


        > **This starts and stops publishing, not the GNSS receiver itself.** GPS is always on;

        > disabling simply returns you to the position that already arrives with the device's
        regular

        > status.


        **While tracking is enabled each published fix carries more than coordinates** — speed,

        heading, fix type and HDOP. See `TrackPoint`.


        > **A tracking device that is stationary indoors may publish nothing at all rather than a

        > poor fix.** Absence of a position is not the same as a position of zero.


        **The `200` returns the values *as applied*, after any clamping** — worth reading rather

        than assuming your request went through unchanged.
      security:
        - apiKey:
            - devices:configure
        - oauth2:
            - devices:configure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                enabled:
                  type: boolean
                  default: false
                  description: '`true` starts publishing position updates; `false` stops them.'
                intervalSeconds:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  default: 10
                  description: >
                    How often a fresh position is read and published. Values at or below zero fall
                    back to the default.
                timeoutMs:
                  $ref: '#/components/schemas/TimeoutMs'
                requestId:
                  $ref: '#/components/schemas/RequestId'
            example:
              requestId: cfg-tracking
              timeoutMs: 5000
              enabled: true
              intervalSeconds: 10
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Confirmed'
                  - $ref: '#/components/schemas/Tracking'
              example:
                status: confirmed
                serial: ABCD1234
                requestId: cfg-tracking
                enabled: true
                intervalSeconds: 10
                at: '2026-08-13T22:04:11.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeviceOffline'
        '500':
          $ref: '#/components/responses/ServerError'
  /devices/claim:
    post:
      operationId: claimDevice
      tags:
        - Ownership
      summary: Take ownership of a device
      description: |
        A device is manufactured, configured in the factory from its product template, and sold.
        **Claiming is how it becomes someone's.**

        > **User token only.** An API key is refused. Claiming decides who controls physical
        > hardware, so it must be an act by an identified person.

        The device is **already configured** — the factory set it up from its product template.
        **Claiming sends it no commands.** What it does instead is **compare** the device against
        that template and tell you whether they still match. If they do not, the response says so
        and offers to bring it up to date, leaving the choice with the new owner rather than
        silently rewriting a device that may have been deliberately customised.

        The comparison is on **ID numbers, types and type parameters, and on rules**. **State is
        never compared** — wiring, power and physical reality decide what a pin reads at boot, and
        no template can promise that.

        Only Justworx hardware can be claimed, and only if it is in stock and unclaimed.
      security:
        - oauth2:
            - devices:own
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - serial
              properties:
                serial:
                  type: string
                  description: The number printed on the device.
                name:
                  type: string
                  maxLength: 120
                  description: Your label for it.
            example:
              serial: ABCD1234
              name: Front Gate
      responses:
        '200':
          description: Claimed. The body reports whether the device still matches its template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResult'
              example:
                serial: ABCD1234
                name: Front Gate
                configMatchesTemplate: false
                templateVersion: 3
                latestTemplateVersion: 5
                differences:
                  - kind: id
                    idNumber: 14
                    difference: missing
                at: '2026-08-18T09:12:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: An API key was used. Claiming requires a user token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: FORBIDDEN
                detail: Claiming a device requires a user token. An API key cannot claim.
                serial: ABCD1234
        '404':
          description: No such serial in stock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: NOT_FOUND
                detail: No device with that serial is available to claim.
                serial: ABCD1234
        '409':
          description: Already claimed. The device has an owner.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: CONFLICT
                detail: That device has already been claimed.
                serial: ABCD1234
        '500':
          $ref: '#/components/responses/ServerError'
  /devices/{serial}/config:
    parameters:
      - $ref: '#/components/parameters/Serial'
    get:
      operationId: getDeviceConfig
      tags:
        - Ownership
      summary: Compare a device against its template
      description: >
        The same comparison claiming performs, on demand. Returns what the device is configured to
        do and whether it still matches the template version it was built from, including
        `originalTemplateVersion` — the version it **shipped** with.


        Compared on ID numbers, types and type parameters, and on rules. **State is never
        compared.**
      security:
        - apiKey:
            - devices:read
        - oauth2:
            - devices:read
      responses:
        '200':
          description: The comparison.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigComparison'
              example:
                serial: ABCD1234
                configMatchesTemplate: true
                templateId: tpl-1
                templateVersion: 3
                originalTemplateVersion: null
                latestTemplateVersion: 3
                differences: '[]'
                at: '2026-09-18T09:42:03.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: applyDeviceConfig
      tags:
        - Ownership
      summary: Bring a device up to a template version
      description: |
        Sends the commands that make the device's IDs and rules match a template version, **and
        updates its UI design to match too**. Configuration and design move together; a device
        brought up to date gets both.

        > **`reset` restores the version the device *originally shipped with*, not the newest one.**
        > Moving to a newer version is a separate, deliberate act. "Put it back how it was" and
        > "give me the latest" are different intentions and are never the same call.
      security:
        - apiKey:
            - devices:configure
        - oauth2:
            - devices:configure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - mode
              properties:
                mode:
                  type: string
                  enum:
                    - reset
                    - upgrade
                  description: >
                    `reset` — back to the version the device shipped with. `upgrade` — to
                    `targetVersion`, or the newest.
                targetVersion:
                  type:
                    - integer
                    - 'null'
                  description: For `upgrade`. Omit for the newest.
                timeoutMs:
                  $ref: '#/components/schemas/TimeoutMs'
                requestId:
                  $ref: '#/components/schemas/RequestId'
            example:
              mode: upgrade
              targetVersion: 5
      responses:
        '202':
          description: Sent.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Sent'
                  - type: object
                    properties:
                      templateVersion:
                        type:
                          - integer
                          - 'null'
                      commands:
                        type: integer
                        description: How many frames were sent to the device.
                      deploy:
                        type: object
                        properties:
                          lastDeployedAt:
                            type: string
                            format: date-time
                          templateVersion:
                            type:
                              - integer
                              - 'null'
              example:
                status: sent
                serial: ABCD1234
                templateVersion: 5
                commands: 12
                deploy:
                  lastDeployedAt: '2026-09-18T09:42:03.000Z'
                  templateVersion: 5
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeviceOffline'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '500':
          $ref: '#/components/responses/ServerError'
  /devices/{serial}/rules:
    parameters:
      - $ref: '#/components/parameters/Serial'
    get:
      operationId: listRules
      tags:
        - Rules
      summary: List every rule
      description: Every rule on the device with its current configuration, **in evaluation order**.
      security:
        - apiKey:
            - devices:read
        - oauth2:
            - devices:read
      responses:
        '200':
          description: The device's rules, in evaluation order.
          content:
            application/json:
              schema:
                type: object
                required:
                  - serial
                  - items
                properties:
                  serial:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Rule'
                  at:
                    type: string
                    format: date-time
              example:
                serial: ABCD1234
                items:
                  - ruleNumber: 1
                    type: digital
                    enabled: true
                    runIntervalMs: 500
                    if:
                      id: 39
                      state: low
                      forMs: 2000
                    then:
                      type: setState
                      io: 11
                      state: high
                  - ruleNumber: 2
                    type: analog
                    enabled: true
                    runIntervalMs: 5000
                    if:
                      id: 14
                      mode: above
                      threshold: 65
                      forMs: 6000
                    then:
                      type: setState
                      io: 10
                      state: low
                at: '2026-08-12T14:03:11.200Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createRule
      tags:
        - Rules
      summary: Create or replace a rule
      description: >
        A rule is a piece of logic that lives **on the device itself**. The device evaluates it

        continuously and acts the moment its condition is met — no cloud round trip, no latency, and

        **it keeps working when the device is offline or out of coverage.**


        Every rule is a **condition** (`if`) the device watches and an **action** (`then`) it

        performs when that condition becomes true.


        **How rules are evaluated**


        · Each rule is checked every `runIntervalMs` — **not continuously**. A rule set to `1000`
          sees the world once a second, so a signal shorter than that can pass unnoticed. For events
          that short, use an `interrupt` ID instead. **The minimum is `500` ms.**
        · Rules run **in `ruleNumber` order**, lowest first, on every pass.

        · `onTrueJumpToRule` and `onFalseJumpToRule` change what runs next, letting you chain or
        skip
          rules. They are **independent of `then`** — a rule can fire its action *and* jump on the
          same pass.
        · Rules act on **IDs**, not raw pins. The ID must already exist on the device.


        **Re-using a `ruleNumber` replaces that rule.**
      security:
        - apiKey:
            - devices:configure
        - oauth2:
            - devices:configure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleCreate'
            examples:
              digital:
                summary: A gate contact, debounced against chatter
                value:
                  requestId: rule-gate-light
                  timeoutMs: 5000
                  ruleNumber: 1
                  type: digital
                  enabled: true
                  runIntervalMs: 500
                  if:
                    id: 39
                    state: low
                    forMs: 2000
                  then:
                    type: setState
                    io: 11
                    state: high
              analog:
                summary: Switch a geyser element off above 65°
                value:
                  requestId: rule-geyser-off
                  timeoutMs: 5000
                  ruleNumber: 2
                  type: analog
                  enabled: true
                  runIntervalMs: 5000
                  if:
                    id: 14
                    mode: above
                    threshold: 65
                    forMs: 6000
                  then:
                    type: setState
                    io: 10
                    state: low
              hysteresis:
                summary: The other half of the pair — back on below 45°, so it cannot chatter
                value:
                  ruleNumber: 3
                  type: analog
                  if:
                    id: 14
                    mode: below
                    threshold: 45
                  then:
                    type: setState
                    io: 10
                    state: high
              schedule:
                summary: A porch light, weekday evenings
                value:
                  requestId: rule-porch-light
                  timeoutMs: 5000
                  ruleNumber: 4
                  type: schedule
                  enabled: true
                  runIntervalMs: 60000
                  if:
                    startTime: '18:00:00'
                    endTime: '22:30:00'
                    daysOfWeek:
                      - mon
                      - tue
                      - wed
                      - thu
                      - fri
                  then:
                    type: setState
                    io: 12
                    state: high
              seasonal:
                summary: Weekend irrigation, summer only — every constraint narrows the last
                value:
                  ruleNumber: 5
                  type: schedule
                  if:
                    startDate: '2026-11-01'
                    endDate: '2027-02-28'
                    startTime: '05:30:00'
                    endTime: '06:00:00'
                    daysOfWeek:
                      - sat
                      - sun
                  then:
                    type: setState
                    io: 13
                    state: high
      responses:
        '200':
          description: The device confirmed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleConfigured'
              example:
                status: confirmed
                serial: ABCD1234
                requestId: rule-gate-light
                ruleNumber: 1
                type: digital
                result: ok
                at: '2026-08-12T14:03:11.200Z'
        '202':
          description: Sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeviceOffline'
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/DeviceTimeout'
    delete:
      operationId: clearRules
      tags:
        - Rules
      summary: Remove every rule
      description: >
        **Destructive.** Removes every rule on the device. Its IDs remain configured, but nothing
        acts on them any more — the device becomes entirely passive until it is told what to do.
        Requires `confirm: true`.
      security:
        - apiKey:
            - devices:configure
        - oauth2:
            - devices:configure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - confirm
              properties:
                confirm:
                  $ref: '#/components/schemas/Confirm'
                timeoutMs:
                  $ref: '#/components/schemas/TimeoutMs'
                requestId:
                  $ref: '#/components/schemas/RequestId'
            example:
              requestId: wipe-rules
              timeoutMs: 5000
              confirm: true
      responses:
        '200':
          description: Cleared.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Confirmed'
                  - type: object
                    required:
                      - cleared
                    properties:
                      cleared:
                        type: integer
                        description: How many rules were removed.
                      result:
                        type: string
                        const: ok
              example:
                status: confirmed
                serial: ABCD1234
                requestId: wipe-rules
                cleared: 4
                result: ok
                at: '2026-08-12T14:03:11.200Z'
        '202':
          description: Sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/DeviceTimeout'
  /devices/{serial}/rules/{ruleNumber}:
    parameters:
      - $ref: '#/components/parameters/Serial'
      - $ref: '#/components/parameters/RuleNumber'
    patch:
      operationId: setRuleEnabled
      tags:
        - Rules
      summary: Enable or disable a rule
      description: >
        Leaves the rule in place and changes only whether it runs. Disabling and re-enabling is how
        you pause behaviour temporarily — deleting loses the definition.


        Always send the state you want. There is deliberately no toggle: a flip depends on what the
        rule is doing *now*, so two clients racing, or one retrying a request it never saw the
        answer to, can leave a rule in the opposite state to the one intended. Changing whether
        something runs must be deliberate.
      security:
        - apiKey:
            - devices:configure
        - oauth2:
            - devices:configure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - enabled
              properties:
                enabled:
                  type: boolean
                timeoutMs:
                  $ref: '#/components/schemas/TimeoutMs'
                requestId:
                  $ref: '#/components/schemas/RequestId'
            example:
              requestId: disarm-rule-1
              timeoutMs: 5000
              enabled: false
      responses:
        '200':
          description: Changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleEnabledChanged'
              example:
                status: confirmed
                serial: ABCD1234
                requestId: disarm-rule-1
                ruleNumber: 1
                enabled: false
                at: '2026-08-12T14:03:11.200Z'
        '202':
          description: Sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeviceOffline'
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/DeviceTimeout'
    delete:
      operationId: deleteRule
      tags:
        - Rules
      summary: Remove one rule
      security:
        - apiKey:
            - devices:configure
        - oauth2:
            - devices:configure
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                timeoutMs:
                  $ref: '#/components/schemas/TimeoutMs'
                requestId:
                  $ref: '#/components/schemas/RequestId'
            example:
              timeoutMs: 0
              requestId: remove-rule-1
      responses:
        '200':
          description: The device confirmed the removal.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Confirmed'
                  - type: object
                    properties:
                      ruleNumber:
                        type: integer
              example:
                status: confirmed
                serial: ABCD1234
                ruleNumber: 1
                at: '2026-08-12T14:03:11.200Z'
        '202':
          description: 'Sent. You asked not to wait, with `timeoutMs: 0`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeviceOffline'
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/DeviceTimeout'
  /devices/{serial}/telemetry:
    parameters:
      - $ref: '#/components/parameters/Serial'
    get:
      operationId: listTelemetry
      tags:
        - Telemetry
      summary: List telemetry configurations
      security:
        - apiKey:
            - devices:read
        - oauth2:
            - devices:read
      responses:
        '200':
          description: Every telemetry configuration on the device.
          content:
            application/json:
              schema:
                type: object
                required:
                  - serial
                  - items
                properties:
                  serial:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Telemetry'
                  at:
                    type: string
                    format: date-time
              example:
                serial: ABCD1234
                items:
                  - telemetryId: 1
                    masterId: 14
                    sampleRateMs: 60000
                    sampleSize: 10
                at: '2026-09-18T09:42:03.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createTelemetry
      tags:
        - Telemetry
      summary: Start sampling an ID
      description: >
        Telemetry samples an ID at a fixed rate on the device and sends the readings up **in
        batches**, rather than one message per reading. Use it for anything you want a continuous
        trace of — a temperature curve, a voltage under load — where polling would be wasteful or
        too coarse.


        A batch is sent every `sampleRateMs × sampleSize`, so `5000 × 30` means a reading every 5
        seconds and a batch every 2½ minutes.


        **Re-using a `telemetryId` replaces that configuration.**
      security:
        - apiKey:
            - devices:configure
        - oauth2:
            - devices:configure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - telemetryId
                - masterId
                - sampleRateMs
                - sampleSize
              properties:
                telemetryId:
                  type: integer
                  description: |
                    Identifies this telemetry configuration. **Re-using a number replaces it.**
                masterId:
                  type: integer
                  description: The ID to sample.
                sampleRateMs:
                  type: integer
                  minimum: 1
                  description: How often to take a reading, in milliseconds.
                sampleSize:
                  type: integer
                  minimum: 1
                  maximum: 60
                  description: How many readings to collect before sending a batch.
                timeoutMs:
                  $ref: '#/components/schemas/TimeoutMs'
                requestId:
                  $ref: '#/components/schemas/RequestId'
            example:
              requestId: tele-temp-trace
              timeoutMs: 5000
              telemetryId: 1
              masterId: 14
              sampleRateMs: 5000
              sampleSize: 30
      responses:
        '200':
          description: The device confirmed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Confirmed'
                  - type: object
                    required:
                      - telemetryId
                    properties:
                      telemetryId:
                        type: integer
                      result:
                        type: string
                        const: ok
              example:
                status: confirmed
                serial: ABCD1234
                requestId: tele-temp-trace
                telemetryId: 1
                result: ok
                at: '2026-08-12T14:03:11.200Z'
        '202':
          description: Sent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeviceOffline'
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/DeviceTimeout'
  /devices/{serial}/telemetry/{telemetryId}:
    parameters:
      - $ref: '#/components/parameters/Serial'
      - name: telemetryId
        in: path
        required: true
        description: The telemetry configuration's number. **Not an ID number.**
        schema:
          type: integer
          minimum: 0
        example: 1
    delete:
      operationId: deleteTelemetry
      tags:
        - Telemetry
      summary: Stop sampling
      description: >
        Removes the telemetry configuration. A configuration that does not exist is a `404` — not a
        `200` reporting that nothing was found.
      security:
        - apiKey:
            - devices:configure
        - oauth2:
            - devices:configure
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                timeoutMs:
                  $ref: '#/components/schemas/TimeoutMs'
                requestId:
                  $ref: '#/components/schemas/RequestId'
            example:
              timeoutMs: 0
              requestId: stop-sampling
      responses:
        '200':
          description: The device confirmed the removal.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Confirmed'
                  - type: object
                    properties:
                      telemetryId:
                        type: integer
              example:
                status: confirmed
                serial: ABCD1234
                telemetryId: 3
                at: '2026-08-12T14:03:11.200Z'
        '202':
          description: 'Sent. You asked not to wait, with `timeoutMs: 0`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/DeviceOffline'
        '500':
          $ref: '#/components/responses/ServerError'
        '504':
          $ref: '#/components/responses/DeviceTimeout'
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      description: |
        An account-wide key (`jwx_live_…`). Server to server only.

        **Never ship one in an app.** It is long-lived, reaches every device on your account, and a
        mobile or browser app can always be decompiled — a key shipped inside one is a key you have
        published.

        Device identifiers, push tokens and installation IDs are **not** credentials either. They
        are identifiers, not secrets — fine for addressing a device, never for proving who you are.
    oauth2:
      type: oauth2
      description: |
        A short-lived token representing one signed-in person. Safe in apps, revocable, and limited
        to that user's own devices.

        It is the **only** credential accepted for actions that change who controls hardware.
        If a person triggered the action, use one: it is the difference between a log entry naming
        who opened a gate and one saying only that your account did.

        **Scopes are declared but not yet enforced.** Every credential currently reaches everything
        its owner can reach, and `GET /me` reports the full set regardless of what was granted. They
        are published so a client written against them today needs no change when enforcement
        arrives — but do not treat a scope as a security boundary yet.
      flows:
        authorizationCode:
          authorizationUrl: https://oauth.justworx.com/oauth2/auth
          tokenUrl: https://oauth.justworx.com/oauth2/token
          scopes:
            devices:read: Read devices, their IDs, values and history
            devices:command: Act on a device
            devices:configure: Create, change and remove IDs, rules and telemetry
            devices:own: Claim, transfer and share
            events:read: Read event history and subscribe to the stream
  parameters:
    Serial:
      name: serial
      in: path
      required: true
      description: The device's serial — the number printed on the unit.
      schema:
        type: string
        minLength: 1
        maxLength: 64
      example: ABCD1234
    IdNumber:
      name: idNumber
      in: path
      required: true
      description: |
        The number of one entry configured on this device. Not a device identifier.
      schema:
        type: integer
        minimum: 0
      example: 10
    RuleNumber:
      name: ruleNumber
      in: path
      required: true
      description: |
        The rule's number on the device, which is also its position in the evaluation order.
      schema:
        type: integer
        minimum: 0
      example: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Cursor:
      name: cursor
      in: query
      required: false
      description: >
        Opaque cursor from the previous page's `nextCursor`. Pass it back with every other filter
        unchanged. It marks an exact position, so no entry is skipped or repeated across pages even
        when several share a timestamp. A cursor this API did not issue is refused with `400
        INVALID_FIELDS`.
      schema:
        type: string
  responses:
    BadRequest:
      description: >
        A required field is missing (`MISSING_FIELDS`), or a field has an invalid value or type
        (`INVALID_FIELDS` — including a `timeoutMs` that is neither `0` nor between 1 and 30000).


        **Bodies are closed.** A property this contract does not describe is rejected by name before
        any handler runs, so a typo in a field name is a `400`, never a silently ignored field. The
        same applies to query parameters. This is enforced from the published document itself, which
        is why a field absent from here is a field the API cannot accept.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: INVALID_FIELDS
            detail: >-
              unknown parameter 'nmae' in the request body for PATCH /devices/{serial}. Accepted:
              name.
            serial: ABCD1234
            requestId: rename-gate
    Unauthorized:
      description: Missing, malformed or expired token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: UNAUTHORIZED
            detail: No credential was presented, or it has expired.
    Forbidden:
      description: The credential is valid but not allowed to reach this device or call.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: FORBIDDEN
            detail: This credential cannot reach that device.
            serial: ABCD1234
    NotFound:
      description: >
        No such device, ID, rule or share — or you have no access to it. On a call naming an ID that
        was never configured, the code is `ID_NOT_CONFIGURED`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: ID_NOT_CONFIGURED
            detail: ID 10 is not configured on this device.
            serial: ABCD1234
            idNumber: 10
    Conflict:
      description: >
        The request is valid but cannot be carried out now — most often the device is offline
        (`DEVICE_OFFLINE`), or a destructive call arrived without `confirm: true`
        (`CONFIRM_REQUIRED`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: DEVICE_OFFLINE
            detail: The device has been offline since 2026-08-12T09:14:02.000Z.
            serial: ABCD1234
            requestId: cfg-door-sensor
            lastSeenAt: '2026-08-12T09:14:02.000Z'
    Unprocessable:
      description: Valid JSON describing an impossible request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: UNPROCESSABLE
            detail: The request is well-formed but describes something that cannot be done.
            serial: ABCD1234
    ServerError:
      description: >
        Something failed inside the API. The request may or may not have reached the device — a
        write that returns this is **not** known to have been discarded, so treat it as unresolved
        rather than as a failure, and read the device's state back before retrying anything that is
        not safe to repeat.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: INTERNAL_ERROR
            detail: The request failed inside the API and its outcome is unknown.
            serial: ABCD1234
            requestId: cfg-door-sensor
    BadGateway:
      description: >
        The device answered, and its reply could not be read. Distinct from `504`, where it never
        answered at all: here the command almost certainly ran, so **do not blindly retry** a write
        that is not safe to repeat. Read the state back instead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: DEVICE_REPLY_MALFORMED
            detail: The device answered and its reply could not be read. The command probably ran.
            serial: ABCD1234
            requestId: cfg-door-sensor
    DeviceOffline:
      description: >
        The device is already known to be offline, so nothing was sent. This is a fast fail, not a
        guarantee — a device can drop between the check and delivery, giving `DEVICE_TIMEOUT`
        instead.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: DEVICE_OFFLINE
            detail: The device has been offline since 2026-08-12T09:14:02.000Z.
            serial: ABCD1234
            requestId: cfg-door-sensor
            lastSeenAt: '2026-08-12T09:14:02.000Z'
    DeviceTimeout:
      description: >
        The device did not answer within `timeoutMs`. **The command was discarded, not queued** — it
        will not run later when the device reconnects. Nothing was applied and nothing is pending.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: DEVICE_TIMEOUT
            detail: The device did not answer within 15000 ms. The command was discarded.
            serial: ABCD1234
            requestId: cfg-door-sensor
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: |
            Stable machine-readable code. **Match on this, never on `detail`** — wording changes.

            Two spellings exist for one condition and both are live: `INTERNAL` comes from the two
            single-ID read routes, `INTERNAL_ERROR` from the shared egress guard. Handle both. They
            will not be reconciled without a deliberate decision, because renaming a code a client
            may already match on is a breaking change however tidy it looks.

            `TOO_MANY_REQUESTS` and `UPSTREAM_ERROR` are **reserved and not currently emitted** —
            declared so the contract is stable if they arrive, in the same spirit as the `429`
            response. The one throttle on this surface answers `RESEND_TOO_SOON`.
          enum:
            - UNAUTHORIZED
            - FORBIDDEN
            - TOO_MANY_REQUESTS
            - MISSING_FIELDS
            - INVALID_FIELDS
            - INVALID_SERIAL
            - FORBIDDEN_EVENT
            - ID_NOT_CONFIGURED
            - CONFIRM_REQUIRED
            - DEVICE_OFFLINE
            - DEVICE_TIMEOUT
            - DEVICE_REPLY_MALFORMED
            - NOT_FOUND
            - CONFLICT
            - UNPROCESSABLE
            - UPSTREAM_ERROR
            - INTERNAL
            - INTERNAL_ERROR
            - ALREADY_INVITED
            - ALREADY_ACCEPTED
            - RESEND_TOO_SOON
        detail:
          type: string
          description: Human-readable explanation. Wording may change; do not parse it.
        serial:
          type: string
          description: The device the call was about, echoed back.
        requestId:
          type:
            - string
            - 'null'
          description: Your reference for the call, echoed back so a failure can be correlated.
        idNumber:
          type:
            - integer
            - 'null'
          description: Present on `ID_NOT_CONFIGURED` — which ID was missing.
        lastSeenAt:
          type:
            - string
            - 'null'
          format: date-time
          description: Present on `DEVICE_OFFLINE` — when the device was last in contact.
        shareId:
          type: string
          description: Present on `ALREADY_INVITED` — the pending share to resend instead.
        retryAfterSeconds:
          type: integer
          description: Present on `RESEND_TOO_SOON` — seconds until a resend is allowed.
      example:
        error: DEVICE_OFFLINE
        serial: ABCD1234
        requestId: cfg-door-sensor
        lastSeenAt: '2026-08-12T09:14:02.000Z'
        detail: The device has been offline since 2026-08-12T09:14:02.000Z.
    NextCursor:
      type:
        - string
        - 'null'
      description: Pass as `cursor` for the next page. `null` on the last page.
    RequestId:
      type: string
      maxLength: 64
      description: >
        Your own reference for the call, returned unchanged on the reply and on any stream event it
        causes, so you can match them up. Omit it and we assign one. For correlation only — **it
        does not deduplicate retries.**
      example: req_01J8XA4T9K
    TimeoutMs:
      type: integer
      minimum: 0
      maximum: 30000
      default: 15000
      description: >
        How long to wait for the device's real answer.


        **Omitting it waits 15000 ms** — it is not fire-and-forget. `200 status: confirmed` means
        the device really did it and the body carries its actual state; `504 DEVICE_TIMEOUT` means
        it stayed silent and the command was discarded rather than queued.


        **`0` is the only fire-and-forget value.** It returns `202 status: sent` immediately and
        never returns `504`. Use it for reboot, which cannot answer, and for batches where you would
        rather read the replies off the event stream.
    Confirm:
      type: boolean
      description: >
        Required on destructive calls. Without `true` the call is refused with `409
        CONFIRM_REQUIRED` and nothing happens.
    Sent:
      type: object
      description: >
        The command was sent. **Sent is not done** — the device's reply, if any, arrives later on
        the event stream (`GET /events`, or the WebSocket at `/api/v2/stream`), carrying the
        `requestId` you supplied so you can match the two up.


        You get this only when you send `timeoutMs: 0`. Every other value, and omitting the field,
        waits for the device and answers `200` or `504` instead.
      required:
        - status
        - serial
      properties:
        status:
          type: string
          const: sent
        serial:
          type: string
        requestId:
          type:
            - string
            - 'null'
      example:
        status: sent
        serial: ABCD1234
        requestId: cfg-door-sensor
    Confirmed:
      type: object
      description: The device answered within `timeoutMs`. These fields are on every confirmed reply.
      required:
        - status
        - serial
        - at
      properties:
        status:
          type: string
          const: confirmed
        serial:
          type: string
        requestId:
          type:
            - string
            - 'null'
        at:
          type: string
          format: date-time
          description: >
            When the device answered. **Treat this as authoritative rather than assuming a reply
            describes the present moment** — a device out of contact buffers its replies and sends
            them on reconnect, so one can arrive later than you expect.
    DeviceSummary:
      type: object
      required:
        - serial
        - online
      properties:
        serial:
          type: string
          description: The device's identity — the number printed on the unit.
        name:
          type:
            - string
            - 'null'
          description: Your label for it.
        online:
          type: boolean
          description: Whether the device is connected right now.
        lastSeenAt:
          type:
            - string
            - 'null'
          format: date-time
          description: >
            When the device last made contact. `null` if it never has. A device offline for a week
            still returns its full last known state, with `online: false` and a week-old
            `lastSeenAt` making that unmistakable.
        access:
          type: string
          enum:
            - owner
            - shared
          description: How you have this device — you own it, or it was shared with you.
    Device:
      allOf:
        - $ref: '#/components/schemas/DeviceSummary'
        - type: object
          required:
            - ids
          properties:
            connection:
              type:
                - string
                - 'null'
              description: How the device is reaching us.
              examples:
                - cellular
            network:
              type:
                - object
                - 'null'
              description: Cellular conditions as the device last reported them.
              properties:
                carrier:
                  type:
                    - string
                    - 'null'
                signal:
                  type:
                    - integer
                    - 'null'
                  description: >
                    Signal strength in **dBm** — closer to zero is stronger. Roughly, better than
                    −70 is good and worse than −100 is marginal. Absent when unknown, never a
                    placeholder.
            location:
              type:
                - object
                - 'null'
              description: >
                Last known position. **Needs no configuration** — devices equipped with a GPS or
                GNSS receiver report it automatically alongside their status. `null` only until the
                device gets its first fix, or where it never can. **Absent means no fix yet, never
                `0,0`.**
              properties:
                latitude:
                  type: number
                longitude:
                  type: number
                at:
                  type: string
                  format: date-time
            ids:
              type: array
              description: Every ID configured on this device, with its last known value.
              items:
                $ref: '#/components/schemas/IdState'
            rules:
              type: array
              description: Every rule on the device, in evaluation order.
              items:
                type: object
                properties:
                  ruleNumber:
                    type: integer
                  type:
                    type: string
                    enum:
                      - digital
                      - analog
                      - schedule
                  enabled:
                    type: boolean
            at:
              type: string
              format: date-time
              description: >
                When the twin was read. **Use each value's own `at`, not this one, to judge
                freshness** — the twin is assembled from readings that arrived at different times,
                so a pin on a 1-second `updateMs` will be current while one on a 60-second interval
                may be nearly a minute old.
    LogEntryType:
      type: string
      enum:
        - value_reported
        - value_written
        - rule_fired
        - position_reported
        - device_online
        - device_offline
        - device_rebooted
        - id_configured
        - id_removed
        - rule_configured
        - rule_changed
        - rules_cleared
        - telemetry_configured
        - telemetry_removed
        - timer_cancelled
        - timers_cancelled
        - tracking_configured
        - set_value
        - start_timer
        - cancel_timer
        - cancel_all_timers
        - reboot
        - create_id
        - update_id
        - delete_id
        - delete_all_ids
        - create_rule
        - update_rule
        - delete_rule
        - clear_rules
        - create_telemetry
        - delete_telemetry
        - configure_tracking
        - configure_device
        - load_template
        - claim_device
        - transfer_device
        - rename_device
        - update_template
        - update_template_ui
        - create_dev_token
        - revoke_dev_token
      description: >
        Two kinds of entry sit in this log, and the difference is worth understanding.


        **An action entry is someone asking for something.** It names who, what they were trying to

        do and whether it worked, and it appears whether or not the request ever reached the device
        —

        an attempt refused because the device was offline is recorded exactly like one that

        succeeded. Its `type` is the **verb**: `set_value`, `create_rule`, `reboot`. Filter for a

        whole class with `kind=action` on the event stream, or for one verb here.


        **A device entry is the device reporting what actually happened**, confirmed by the hardware

        itself. A request and its result are therefore two entries, not one: the first says what was

        asked, the second says what the device did.


        ### What the device reports


        · `value_reported` — an ID reported its value, from a self-update, a read, or a rule firing

        · `value_written` — a value was written to an ID and the device confirmed it

        · `rule_fired` — a rule on the device met its condition and ran

        · `id_configured` — an ID was created or its configuration changed

        · `id_removed` — an ID was removed

        · `rule_configured` — a rule was added or replaced. See `result`

        · `rule_changed` — a rule was enabled, disabled or deleted

        · `rules_cleared` — every rule was cleared

        · `telemetry_configured` / `telemetry_removed` — a telemetry configuration changed

        · `timer_cancelled` / `timers_cancelled` — a pending timer was cancelled

        · `position_reported` — a GNSS fix was published

        · `tracking_configured` — live tracking settings were applied

        · `device_online` / `device_offline` — the connection came or went

        · `device_rebooted` — the device restarted


        ### What a person or an integration asked for


        Each of these carries `actor` naming who asked, and `action` repeating the verb.


        · `set_value`, `start_timer`, `cancel_timer`, `cancel_all_timers` — acting on an ID

        · `create_id`, `update_id`, `delete_id`, `delete_all_ids` — configuring IDs

        · `create_rule`, `update_rule`, `delete_rule`, `clear_rules` — configuring rules

        · `create_telemetry`, `delete_telemetry` — configuring telemetry

        · `reboot`, `configure_device`, `configure_tracking`, `load_template` — acting on the device

        · `claim_device`, `transfer_device`, `rename_device` — ownership and naming

        · `update_template`, `update_template_ui` — authoring changes that reached this device

        · `create_dev_token`, `revoke_dev_token` — credentials issued against this account
    LogEntry:
      type: object
      required:
        - at
        - kind
      description: >
        One entry. Fields beyond `at`, `kind`, `type` and `category` depend on what the entry is —
        an action entry carries `actor` and `action`, a device entry carries whatever it concerns.
        **Absent means not applicable, never unknown.**
      properties:
        at:
          type: string
          format: date-time
        kind:
          type: string
          enum:
            - device
            - action
            - presence
          description: >
            **Who originated the entry**, and the field to group an audit view on. `device` — the
            device reported it. `action` — a person or an integration asked for it, and `actor`
            names them. `presence` — the connection came or went.


            Independent of `category`, which is a display grouping, and independent of whether the
            entry carries a `message`: an action a person took can be narrated and is still
            `action`. The same field, with the same three values, is on every `EventItem`.
        type:
          oneOf:
            - $ref: '#/components/schemas/LogEntryType'
            - type: 'null'
          description: What happened. Null on an entry whose row carries no event name.
        category:
          type:
            - string
            - 'null'
          enum:
            - alert
            - action
            - state
            - connection
            - null
          description: >
            The coarse grouping, derived from `type` -- what a UI colour-codes on.

            `action` is something a person did. `state` is an IO reporting a value. `connection` is
            the device's availability: online, offline and rebooted all answer "can I reach it".

            **`alert` is declared but nothing produces it yet.** An alert means a threshold or rule
            condition the owner asked to be told about, and that decision has not been made. Do not
            read the enum as evidence that alerts are wired.
        idNumber:
          type:
            - integer
            - 'null'
        value:
          $ref: '#/components/schemas/IdValueField'
        ruleNumber:
          type:
            - integer
            - 'null'
        telemetryId:
          type:
            - integer
            - 'null'
        action:
          type:
            - string
            - 'null'
          description: >
            On an `action` entry, what was being attempted, in plain terms — `set_value`,
            `create_rule`, `reboot`. On a `rule_changed` entry, what happened to the rule —
            `enabled`, `disabled`, `toggled`, `deleted`.
        result:
          type:
            - string
            - 'null'
          enum:
            - added
            - replaced
            - null
          description: On `rule_configured`, whether the rule was new or replaced an existing one.
        message:
          type:
            - string
            - 'null'
          description: >
            The event as a sentence — "Wayne opened the Main Gate", "Main Gate opened". Composed
            when the event happened and stored with it, so it says what it said at the time:
            renaming an IO or changing a verb afterwards does not rewrite past entries.


            Identical to the `message` the same row carries over the event stream. Absent on older
            entries, and on entries the vocabulary has nothing to say about — a configuration change
            to an unnamed IO, for instance.
        actor:
          type:
            - object
            - 'null'
          description: >
            Who asked, on an `action` entry. Device events have no actor — nobody asked, the device
            reported.
          properties:
            userId:
              type: string
            name:
              type:
                - string
                - 'null'
              description: >
                Their display name as it was when they did this, or their email address where they
                had no name set. Stored with the entry rather than looked up, so the log records who
                acted under the name they were using; renaming yourself later does not rewrite it.
                Absent on older entries.
            surface:
              type:
                - string
                - 'null'
              enum:
                - app
                - public
                - null
        firedByRule:
          type:
            - integer
            - 'null'
          description: >
            The rule that caused this, when a rule on the device fired the command rather than the
            platform sending it. Null means the platform issued it.
        requestId:
          type:
            - string
            - 'null'
          description: >
            Your reference, on entries caused by something you sent. **Absent on entries the device
            raised on its own** — a self-update, a rule firing, a connection dropping.
    DeviceEventSettings:
      type: object
      description: >
        The effective event settings for one device -- the product's catalog with your overrides
        applied -- plus what each entry looked like before you touched it.
      required:
        - serial
        - events
        - count
      properties:
        serial:
          type: string
          description: The device this applies to.
        count:
          type: integer
        events:
          type: array
          items:
            type: object
            required:
              - key
              - enabled
              - type
              - channel
              - ownerOverridable
              - overridden
            properties:
              key:
                type: string
                description: >
                  `event`, `event#id` or `event#id#state`. Resolved most-specific-first at delivery,
                  so `value_reported#39` beats `value_reported` for IO 39.
              enabled:
                type: boolean
              type:
                type: string
                description: The product's classification. Read-only; it sets the push ceiling.
              channel:
                type: string
                enum:
                  - push
                  - log
                  - both
              ownerOverridable:
                type: boolean
                description: Whether this event may be overridden at all. False means a write is refused.
              overridden:
                type: array
                description: Which fields you have changed from the product default.
                items:
                  type: string
                  enum:
                    - enabled
                    - channel
              productDefault:
                type: object
                description: What the product decided, so a client can offer a reset.
                properties:
                  enabled:
                    type: boolean
                  channel:
                    type: string
                    enum:
                      - push
                      - log
                      - both
    DeviceEventOverrides:
      type: object
      description: >
        Your override layer, keyed exactly as the product's catalog is. This REPLACES the layer -- a
        key you omit reverts to the product default. `type` is not accepted.
      properties:
        events:
          type: object
          additionalProperties:
            type: object
            properties:
              enabled:
                type: boolean
              channel:
                type: string
                enum:
                  - push
                  - log
                  - both
                description: |
                  `push` is refused if the product's type for this event does not allow pushing.
    DeviceEventOverrideResult:
      type: object
      required:
        - serial
        - overrides
        - events
      properties:
        serial:
          type: string
        overrides:
          type: integer
          description: How many keys the stored layer now holds.
        events:
          type: object
          additionalProperties:
            type: object
        note:
          type: string
    EventPage:
      type: object
      required:
        - items
        - cursor
        - hasMore
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventItem'
        cursor:
          type: string
          description: >
            Pass as `since` next time, on the long poll or on a WebSocket `subscribe` frame — they
            are the same cursor and the socket mints none of its own.


            **Always present, including on an empty page.** A first call with no `since` gets a
            cursor minted at the instant the request started looking, so "start from now" is
            expressible on the very first call. Never send `null` back: a null `since` means *from
            the beginning of history*, which is the opposite of what an empty page means.
        hasMore:
          type: boolean
          description: >
            The page filled to the limit and more is waiting. Poll again immediately with the
            returned `cursor` rather than waiting.
    EventItem:
      type: object
      required:
        - cursor
        - ts
        - event
        - kind
      properties:
        cursor:
          type: string
        ts:
          type: string
          format: date-time
        type:
          type:
            - string
            - 'null'
          description: >
            The notification class. **Null, together with `channel: "none"`, when the row narrates
            nothing:** an ID configured with `states` reported a value that matched no entry, which
            is the author saying this reading is not worth mentioning. Not an error, and not a row
            to discard — it is still a real reading and still carries `data`.


            Classification is deliberately NOT frozen onto a row. It is resolved when the row is
            read, so an event an owner disables today stops being classified as a push today, on
            rows written yesterday too. Only the sentence is frozen.
        kind:
          type: string
          enum:
            - device
            - action
            - presence
          description: >
            **Who originated the row.** `device` — the device reported it. `action` — a person or an
            integration asked for it, and the row carries `actor`. `presence` — a connection
            transition, `device_online` or `device_offline`.


            Independent of whether the row narrates: an action a person took CAN carry a `message`
            and is still `action`. Label on this, filter on this or on `message`. Computed when the
            row is read, never stored.
        event:
          type: string
          description: What happened, in contract vocabulary. Never a command number.
        serial:
          type:
            - string
            - 'null'
          description: The device the row is about. Null where it could not be resolved.
        message:
          type:
            - string
            - 'null'
          description: |
            The sentence, composed server-side. Null when the event is configured to carry none.
        actor:
          type:
            - object
            - 'null'
          description: >
            Who asked for this. NULL on device-reported events -- which means we do not know whether
            a person was involved, a different statement from an unknown person. `name` is the
            user's display name, or their email address where no name is on file.
          properties:
            userId:
              type: string
            name:
              type:
                - string
                - 'null'
            surface:
              type:
                - string
                - 'null'
        channel:
          type: string
          enum:
            - push
            - log
            - both
            - none
          description: >
            Where this row was delivered. `none` means it was narrated nowhere — see `type` above.
            Like `type`, resolved when the row is read rather than frozen when it was written.
        data:
          type: object
          description: The event's own fields -- the IO number, the value, the rule number.
    PinState:
      type: string
      enum:
        - high
        - low
    UpdateMs:
      type: integer
      minimum: 200
      default: 1000
      description: >
        How often the device re-reads the ID, in milliseconds. **`200` is the floor and it is the
        same floor for every type**: `201` is valid, `999` is valid, and anything from `0` to `199`
        is **rejected** — including `0`. **There is no "off".**


        Omitting it gives you the `1000` ms default. Sending `0` does NOT: it is refused like any
        other value below the floor. The firmware does accept `0` as "never self-poll", and this API
        deliberately does not offer it — an ID that never polls reads back unchanged, and a
        developer has no way to tell that from a broken sensor.


        Set it low for something you need to react to quickly, high for a slow-moving sensor where a
        reading every second is wasted traffic.
    UpdateMode:
      type: string
      enum:
        - onChange
        - never
      default: onChange
      description: >
        When a self-update is reported upstream. `onChange` reports only when the value differs from
        last time · `never` updates the stored value silently, reporting nothing — use it when you
        want the device to keep its own value current without telling you about each change.


        **`always` is not accepted here.** It would make the device report every reading whether or
        not anything had changed, which on a metered connection is continuous paid traffic carrying
        no new information — an analog input jitters constantly, so every jitter would become a
        publish. It would contradict the one principle the whole API is built on: only changes are
        reported.


        The response field accepts three values where this request field accepts two: some devices
        report `always`, and that value is still readable even though it cannot be set through this
        field. The asymmetry is deliberate, not an oversight.
    IdType:
      type: string
      description: |
        What an ID is. Physical types bind a pin; logical types compute or store a value.

        **Check your module's datasheet before choosing a pin.** Not every pin can be every type —
        some are general-purpose, others are fixed-function, and it is specific to the module.

        Two further types exist that are not documented here. Their parameters are not finalised;
        contact support before building against them.
      enum:
        - digitalInput
        - digitalOutput
        - digitalPullup
        - analogInput
        - interrupt
        - momentaryOutput
        - delayedOutput
        - textVariable
        - math2xId
    IdTypeReported:
      type: string
      description: |
        The type of an ID **as reported back to you**. Every value of `IdType`, plus `unsupported`.

        `unsupported` means the device is running a configuration this API does not recognise,
        and it is reported rather than hidden so that you can see it. In practice this should not
        happen: a type outside the supported set is refused when you configure an ID. The case it
        exists for: a type no longer in the supported set, while a device already running it
        stays in the field.

        When `type` is `unsupported`, `value` is `null` — the device answered, but nothing in the
        answer can be interpreted safely. Treat the ID as present and unreadable, not as absent.
        The forced single-value read (`IdValue`) also reports `deviceReply: -1` in this case; the
        other ID responses do not carry it.
      enum:
        - digitalInput
        - digitalOutput
        - digitalPullup
        - analogInput
        - interrupt
        - momentaryOutput
        - delayedOutput
        - textVariable
        - math2xId
        - unsupported
    DigitalInputConfig:
      type: object
      description: >
        Reads an external on/off signal — a door contact, a push button, a float switch. The pin
        reads whatever is driving it; if nothing is, the reading floats and is unreliable. Use
        `digitalPullup` instead when the external device only pulls the line low.
      required:
        - type
        - pin
      properties:
        type:
          type: string
          const: digitalInput
        pin:
          type: integer
          description: The physical pin to configure.
        updateMs:
          $ref: '#/components/schemas/UpdateMs'
        updateMode:
          $ref: '#/components/schemas/UpdateMode'
    DigitalOutputConfig:
      type: object
      description: >
        Drives something — a relay, a contactor, an LED, a gate motor. This is the type you switch
        by writing its value, or from a rule action.
      required:
        - type
        - pin
      properties:
        type:
          type: string
          const: digitalOutput
        pin:
          type: integer
        bootState:
          allOf:
            - $ref: '#/components/schemas/PinState'
          description: >
            The state the pin takes the moment the device powers up, before anything has spoken to
            it. **Choose it deliberately** — on a device controlling a gate or a pump, the wrong
            boot state means the hardware energises on every power cycle.


            **The default is module-specific.** Check your module's documentation — it is a property
            of the hardware, not of this API, and it is not the same on every module. Do not assume
            a pin comes up low.
        updateMs:
          $ref: '#/components/schemas/UpdateMs'
        updateMode:
          $ref: '#/components/schemas/UpdateMode'
    DigitalPullupConfig:
      type: object
      description: >
        A digital input with the device's **internal pull-up resistor** enabled. The pin sits high
        on its own and reads low only when something actively pulls it to ground. Use it for
        anything that switches to ground — a dry-contact switch, a reed sensor, an open-collector
        output. It removes the need for an external pull-up, and a disconnected wire reads high
        rather than floating unpredictably.
      required:
        - type
        - pin
      properties:
        type:
          type: string
          const: digitalPullup
        pin:
          type: integer
        updateMs:
          $ref: '#/components/schemas/UpdateMs'
        updateMode:
          $ref: '#/components/schemas/UpdateMode'
    AnalogInputConfig:
      type: object
      description: |
        Reads a varying voltage — a temperature probe, a pressure sensor, a tank level.

        The pin gives a voltage, which is rarely the number you want. `referenceMv` and `maxVoltage`
        convert it into a real-world unit **on the device**, so rules, telemetry and your app all
        see the value in the units you care about:

        `reported value = pin millivolts × (maxVoltage ÷ referenceMv)`

        Both describe **the divider an installer measures**, not a scale against a raw ADC count:
        `referenceMv` is the voltage at the pin, `maxVoltage` is what the sensor reads when the pin
        sits at it. Send **both or neither** — one without the other is refused, because a lone
        `referenceMv` scales by zero and a lone `maxVoltage` divides by it. Neither given is a valid
        state rather than an error: the device then reports raw pin millivolts, which is what you
        read while working the divider out.

        **Get this wrong and every rule threshold built on this ID is measuring the wrong thing.**
        Confirm against a known reference before you build on it.
      required:
        - type
        - pin
      properties:
        type:
          type: string
          const: analogInput
        pin:
          type: integer
        referenceMv:
          type: integer
          description: >
            **The voltage at the pin, in millivolts**, at the point you are calibrating against —
            measured, not calculated. Requires firmware v8.0.0 or later.


            **The ADC saturates near 2650 mV and does it silently** — past that the reading stops
            rising and nothing reports an error. Size the divider so the pin stays at or below about
            2450 mV at the sensor's full scale.
        maxVoltage:
          type: number
          description: >
            **What the sensor is reporting when the pin sits at `referenceMv`** — volts, bar,
            degrees, litres, whatever this ID measures. Requires firmware v8.0.0 or later. `0` means
            uncalibrated, exactly as omitting the pair does.
        updateMs:
          $ref: '#/components/schemas/UpdateMs'
        updateMode:
          $ref: '#/components/schemas/UpdateMode'
    InterruptConfig:
      type: object
      description: >
        Reacts the **instant** its signal changes, rather than waiting for the next polling
        interval. This is the difference between catching an event and missing it: a pulse from a
        flow meter or an energy meter can be far shorter than any sensible polling interval, and a
        polled input will simply never see it. Because it acts on the device with no round trip to
        the cloud, `trigger` runs in milliseconds **even while the device is offline**.
      required:
        - type
        - pin
        - edge
        - pinMode
        - trigger
      properties:
        type:
          type: string
          const: interrupt
        pin:
          type: integer
          description: The physical pin to watch.
        edge:
          type: string
          enum:
            - rising
            - falling
            - change
            - onLow
            - onHigh
          description: >
            Which transition fires it — `rising` (low→high) · `falling` (high→low) · `change`
            (either) · `onLow` · `onHigh`.
        pinMode:
          type: string
          enum:
            - input
            - inputPullup
            - inputPulldown
          description: >
            How the pin is biased. `inputPullup` for a sensor that pulls the line to ground,
            `inputPulldown` for one that pulls it to the supply, `input` when the line is already
            biased externally.


            **Required, and deliberately not defaulted.** Which one is correct depends on the
            wiring, which this API cannot know — and an interrupt pin left unbiased floats, so it
            can self-trigger and fire its action on nothing.
        trigger:
          allOf:
            - $ref: '#/components/schemas/Action'
          description: The action to fire, using the same shape as a rule's `then`.
        enabled:
          type: boolean
          default: true
          description: Whether the interrupt is armed.
        intervalMs:
          type: integer
          default: 0
          description: Minimum time between fires — debounces a noisy or bouncing signal.
        threshold:
          type: number
          default: 0
          description: Signal threshold, where the pin type supports one.
        updateMs:
          $ref: '#/components/schemas/UpdateMs'
        updateMode:
          $ref: '#/components/schemas/UpdateMode'
    MomentaryOutputConfig:
      type: object
      description: |
        **Timed.** On trigger the pin goes to `triggerState` for `durationMs`, then returns to
        `revertState` on its own. The timer is set once, here — every trigger afterwards replays
        exactly this.

        This is the type for anything that should fire and release without being told twice: a gate
        trigger, a door strike, a starter relay, a horn. Because the duration lives on the device,
        the release still happens if the network drops immediately after the trigger.

        **Trigger it by writing to the ID** — the value sent is ignored.

        Re-triggering while the timer runs **restarts the clock**: a second trigger 1 s into a 3 s
        timer gives a fresh, full 3 s. It does not extend the remaining time, and it is not ignored.
        End it early with `DELETE …/timer`; override the duration for one shot with `POST …/timer`.
        Reads always report the pin's real current state — while the timer runs, after it reverts,
        or idle.
      required:
        - type
        - pin
        - triggerState
        - durationMs
        - revertState
      properties:
        type:
          type: string
          const: momentaryOutput
        pin:
          type: integer
        triggerState:
          allOf:
            - $ref: '#/components/schemas/PinState'
          description: The state to hold while the timer runs.
        durationMs:
          type: integer
          description: How long to hold `triggerState`.
        revertState:
          allOf:
            - $ref: '#/components/schemas/PinState'
          description: The state to return to when the timer expires.
        bootState:
          allOf:
            - $ref: '#/components/schemas/PinState'
          description: >
            The state the pin takes on power-up. **The default is module-specific** — check your
            module's documentation.
        updateMs:
          $ref: '#/components/schemas/UpdateMs'
        updateMode:
          $ref: '#/components/schemas/UpdateMode'
    DelayedOutputConfig:
      type: object
      description: |
        **Waits, then sets once.** On trigger nothing happens immediately; after `delayMs` the pin
        goes to `state` and stays there.

        Use it for anything that should happen a fixed time after an event rather than straight
        away — a courtesy light a minute after dusk, a pump that must not restart within its
        cool-down window, a delayed alarm arm.

        It is the mirror of `momentaryOutput`: that one acts now and reverts later, this one does
        nothing now and acts later. Triggered the same way — write to the ID, value ignored.
        Re-triggering restarts the full delay, `DELETE …/timer` abandons the pending set, and
        `POST …/timer` overrides it for one shot.
      required:
        - type
        - pin
        - delayMs
        - state
      properties:
        type:
          type: string
          const: delayedOutput
        pin:
          type: integer
        delayMs:
          type: integer
          description: How long to wait after the trigger before acting.
        state:
          allOf:
            - $ref: '#/components/schemas/PinState'
          description: The state to set when the delay elapses.
        bootState:
          allOf:
            - $ref: '#/components/schemas/PinState'
          description: >
            The state the pin takes on power-up. **The default is module-specific** — check your
            module's documentation.
        updateMs:
          $ref: '#/components/schemas/UpdateMs'
        updateMode:
          $ref: '#/components/schemas/UpdateMode'
    TextVariableConfig:
      type: object
      description: >
        A text value stored on the device. Useful for anything the device needs to hold and hand out
        on its own — a display message, a status string, a label sent to an attached screen —
        without needing the cloud to supply it each time. No pin behind it.
      required:
        - type
        - text
      properties:
        type:
          type: string
          const: textVariable
        text:
          type: string
          description: The value the ID starts with.
        updateMs:
          $ref: '#/components/schemas/UpdateMs'
    Math2xIdConfig:
      type: object
      description: >
        A value computed from two other IDs — `id1 <operator> id2` — recalculated continuously on
        the device. This lets the device derive a meaningful number on its own: power from voltage
        and current, a differential between two probes, a total across two flow meters. The result
        is a normal ID, so rules can watch it and telemetry can sample it exactly like a physical
        reading. **Both operands must be IDs that already exist on the device.**
      required:
        - type
        - id1
        - operator
        - id2
      properties:
        type:
          type: string
          const: math2xId
        id1:
          type: integer
          description: The first operand — an existing ID.
        operator:
          type: string
          enum:
            - +
            - '-'
            - '*'
            - /
        id2:
          type: integer
          description: The second operand — an existing ID.
        updateMs:
          $ref: '#/components/schemas/UpdateMs'
    IdCreateEnvelope:
      type: object
      required:
        - idNumber
      properties:
        idNumber:
          type: integer
          minimum: 0
          description: >
            The ID number to create. **Re-using an existing number replaces that ID's
            configuration.**
        timeoutMs:
          $ref: '#/components/schemas/TimeoutMs'
        requestId:
          $ref: '#/components/schemas/RequestId'
        name:
          type:
            - string
            - 'null'
          minLength: 1
          maxLength: 60
          description: >
            Your name for this ID, overriding the one the product author gave it. Cloud metadata:
            never sent to the device.


            Three states, as with every other metadata field, and the middle one is not what most
            people expect. Absent leaves the template's name standing; a string is yours; an
            explicit `null` means **this ID has no name** — it does not fall back to the template.
            That is deliberate and it is how every metadata field here behaves: a `null` you sent on
            purpose is an instruction, not an absence.


            Blank is refused — send `null` if you mean to clear it — and so are control characters,
            because this name is rendered inside a sentence a person reads.


            It is what `{ioName}` resolves to in a `states` sentence, and what the three ID reads
            return as `name`.
          example: Main Gate Light
        stateKeywords:
          type:
            - object
            - 'null'
          additionalProperties:
            type: string
          description: >
            How a person reads this ID's states -- `{"0":"Closed","1":"Open"}`. Cloud metadata: it
            is never sent to the device. A value here overrides whatever the template supplies, and
            an explicit `null` clears the override rather than falling back to the template.
        verbs:
          type:
            - object
            - 'null'
          description: |
            Past-tense wording for each state, composing a line as
            `<subject> <verb> <article> <name>` — "Bob opened the Main Gate". Cloud metadata, never
            sent to the device. Each state merges independently: sending only `state1` leaves
            `state0` alone, and an explicit `null` on one state clears just that one.

            **Accepted and validated, but `states` is what composes a notification** — use
            `states` for a comparison, a `sentence` and a channel, and `showActor` for the actor.
            A `verbs` sentence is assembled **around the person**, so an event with no resolvable
            actor produces no sentence and cannot be pushed. A `states` sentence is impersonal and
            the actor is only ever **appended**, so it survives not knowing who acted.
          properties:
            state1:
              $ref: '#/components/schemas/StateVerb'
            state0:
              $ref: '#/components/schemas/StateVerb'
        linkedIo:
          type:
            - integer
            - 'null'
          description: >
            The ID whose state really reports what this one does. Two IDs that are the same physical
            thing: an action a person commands -- a relay that fires a gate motor -- and the sensor
            that says whether the gate actually opened. Set it on the ACTION ID, pointing at its
            state source.

            Three states. Absent: the template's pairing applies. A number: this pairing, replacing
            the template's. `null`: EXPLICITLY UNLINKED -- the template's pairing is suppressed, not
            restored. On read, the value is the link actually in force.

            SENT TO THE DEVICE for a `momentaryOutput` or `delayedOutput` (requires firmware v8.10.0
            or later). A momentary or delayed output has no state worth reading -- a gate relay runs
            on a timer and reverts -- so once linked, every state read of the action ID reports its
            sensor instead, while the ID keeps its own type. The link travels in the ID's
            configuration. Changing it with a body that sets only `linkedIo` still answers `200
            saved` at once; the configuration is then re-sent to the device in the background, and
            is also re-sent if the linked sensor is deleted. A link to an ID the device does not
            have is configured as unlinked until that ID exists. For every other type the link stays
            cloud-only.

            A linked output's write reports the device's answer, and for these two types that answer
            is the SENSOR at that instant -- opening a gate answers `low` because it has not moved
            yet. The command still ran.

            Events from the state ID are named after the action ID, because nobody has heard of the
            sensor, and carry `onBehalfOf` so a caller can see which ID the sentence spoke for. A
            linked momentary or delayed output's own value reports are not logged as separate
            events: the device reports the sensor under both IDs, and one gate movement would
            otherwise appear twice.
        states:
          type:
            - array
            - 'null'
          maxItems: 20
          items:
            $ref: '#/components/schemas/IdStateEntry'
          description: >
            What this ID should SAY when its value changes, and where to say it. Cloud metadata:
            never sent to the device, and evaluated here rather than on it.


            **A device report and a write are not judged the same way.** A report is compared
            against the value the twin already held, and only a change continues. A write is an
            action a person or a rule performed, and it happened whether or not it landed on the
            value the ID already held — a momentary output reports its trigger value on every press,
            so comparing it would silence every press after the first.


            Each entry is a comparison, a sentence, and a channel. **Every entry is evaluated**, not
            just the first one that matches, so overlapping entries all fire -- one can log "Low
            battery zone entered" while another pushes "Critical battery"; the same reading produces
            one log line and one notification. An entry fires on the reading where it BECOMES true
            and stays quiet while it remains true, so a value sitting inside a range does not
            repeat.


            **No match means no event.** Not a fallback sentence, not a default: silence. An ID that
            has been given `states` is fully described by them, and a value outside every entry is
            something the author chose not to narrate.


            Three states, like every other metadata field. Absent: whatever the template deployed
            stands. A list: this list, replacing the template's. `null` or `[]`: the author is
            saying this ID narrates NOTHING, and the template's sentences are suppressed rather than
            restored.
        showActor:
          type:
            - boolean
            - 'null'
          description: >
            Append ` by <name>` to this ID's sentences when a person caused the change. Default
            false.


            **The actor is appended, never composed in.** The sentence is written impersonally and
            the suffix is added afterwards, only when a person is actually known and their name
            resolves. A device-initiated change, or a name that cannot be resolved, costs the suffix
            and never the event — notifications cannot depend on an actor being present.
    IdStateEntry:
      type: object
      required:
        - when
        - sentence
      description: |
        One thing an ID says, and where it says it.
      properties:
        when:
          $ref: '#/components/schemas/IdStateWhen'
        sentence:
          type: string
          minLength: 1
          maxLength: 200
          description: >
            The line a person reads. Three tokens are substituted at delivery: `{ioName}` is this
            ID's own name, `{deviceName}` is the device's, and `{value}` is the reading that fired
            the entry. An unknown token is left alone; a token with nothing behind it renders empty
            and the surrounding whitespace collapses.


            `{ioName}` NOT `{name}`: a sentence may carry the ID's name and the device's name in one
            breath -- "Main Gate Light on the Bench Board" -- and `{name}` beside `{deviceName}`
            reads as though one of them were the general case. They are two different things.
          example: '{ioName} battery is low at {value}V'
        channel:
          type: string
          enum:
            - log
            - push
            - both
          default: log
          description: >
            Where this sentence goes. `log` writes an entry readable on `GET /devices/{serial}/log`
            and `GET /events`. `push` sends a mobile notification and writes no log entry. `both`
            does both from the one reading.
        alert:
          type: boolean
          default: false
          description: >
            Marks the entry as an alert rather than ordinary activity, setting the served row's
            `type` to `alert`. It is a severity class the client renders differently and, for a
            push, the class that may interrupt a quiet mode -- so reserve it for readings that
            warrant waking a person.
    IdStateWhen:
      description: >
        The comparison that fires an entry. Numeric comparisons need a number on BOTH sides: a text
        reading is not "less than 30", it is not comparable, and a guess either way would be wrong.
      oneOf:
        - $ref: '#/components/schemas/StateWhenAny'
        - $ref: '#/components/schemas/StateWhenEquality'
        - $ref: '#/components/schemas/StateWhenOrdered'
        - $ref: '#/components/schemas/StateWhenBetween'
      discriminator:
        propertyName: op
        mapping:
          any: '#/components/schemas/StateWhenAny'
          eq: '#/components/schemas/StateWhenEquality'
          ne: '#/components/schemas/StateWhenEquality'
          lt: '#/components/schemas/StateWhenOrdered'
          lte: '#/components/schemas/StateWhenOrdered'
          gt: '#/components/schemas/StateWhenOrdered'
          gte: '#/components/schemas/StateWhenOrdered'
          between: '#/components/schemas/StateWhenBetween'
    StateWhenAny:
      type: object
      required:
        - op
      description: >
        Fires on EVERY report, with no comparison at all.


        **Only available on an action ID linked to another ID for its state**, and refused with `400
        INVALID_FIELDS` anywhere else. The case it exists for: a momentary output linked to a sensor
        writes the same value on every press, so a comparison fires once and is then suppressed as a
        repeat for ever -- but for a button, every press IS the event.


        The scope is checked again at delivery, against the link as it stands THEN, because a link
        can be removed after the sentence was authored. An `any` on an ID that is no longer a linked
        action simply stops matching -- it fails closed rather than becoming a firehose.
      properties:
        op:
          type: string
          const: any
    StateWhenEquality:
      type: object
      required:
        - op
        - value
      description: Equality against a number or a short piece of text.
      properties:
        op:
          type: string
          enum:
            - eq
            - ne
        value:
          oneOf:
            - type: number
            - type: string
              minLength: 1
              maxLength: 120
    StateWhenOrdered:
      type: object
      required:
        - op
        - value
      description: >
        An ordered comparison. The value must be a NUMBER -- ordering text is refused with `400
        INVALID_FIELDS`, because "warm" > "cold" is alphabetical and that is never what the author
        meant.
      properties:
        op:
          type: string
          enum:
            - lt
            - lte
            - gt
            - gte
        value:
          type: number
    StateWhenBetween:
      type: object
      required:
        - op
        - min
        - max
      description: >
        A range, INCLUSIVE at both ends. Two named bounds rather than a two-element `value`, because
        every other consumer reads `value` as one thing. `min` above `max` matches nothing for ever,
        so it is refused with `400 INVALID_FIELDS` rather than stored. Sending `value` alongside is
        refused too -- it would leave a field nothing reads, looking like a comparison.
      properties:
        op:
          type: string
          const: between
        min:
          type: number
        max:
          type: number
    StateVerb:
      type:
        - object
        - 'null'
      required:
        - verb
      properties:
        verb:
          type: string
          enum:
            - none
            - opened
            - closed
            - switched on
            - switched off
            - activated
            - de-activated
            - enabled
            - disabled
            - raised
            - lowered
            - locked
            - unlocked
          description: >
            An unrecognised verb is REFUSED, never defaulted -- a silent default would render "Bob
            opened Main Gate" and read as a copy bug forever.
        suffix:
          type: string
          enum:
            - none
            - the
            - a
          default: none
          description: The article placed before the ID's name.
    UpdateIdMetadata:
      allOf:
        - $ref: '#/components/schemas/IdCreateEnvelope'
        - type: object
          not:
            required:
              - type
          properties:
            type:
              type: string
              enum:
                - digitalInput
                - digitalOutput
                - digitalPullup
                - analogInput
                - interrupt
                - momentaryOutput
                - delayedOutput
                - textVariable
                - math2xId
    CreateDigitalInput:
      allOf:
        - $ref: '#/components/schemas/IdCreateEnvelope'
        - $ref: '#/components/schemas/DigitalInputConfig'
    CreateDigitalOutput:
      allOf:
        - $ref: '#/components/schemas/IdCreateEnvelope'
        - $ref: '#/components/schemas/DigitalOutputConfig'
    CreateDigitalPullup:
      allOf:
        - $ref: '#/components/schemas/IdCreateEnvelope'
        - $ref: '#/components/schemas/DigitalPullupConfig'
    CreateAnalogInput:
      allOf:
        - $ref: '#/components/schemas/IdCreateEnvelope'
        - $ref: '#/components/schemas/AnalogInputConfig'
    CreateInterrupt:
      allOf:
        - $ref: '#/components/schemas/IdCreateEnvelope'
        - $ref: '#/components/schemas/InterruptConfig'
    CreateMomentaryOutput:
      allOf:
        - $ref: '#/components/schemas/IdCreateEnvelope'
        - $ref: '#/components/schemas/MomentaryOutputConfig'
    CreateDelayedOutput:
      allOf:
        - $ref: '#/components/schemas/IdCreateEnvelope'
        - $ref: '#/components/schemas/DelayedOutputConfig'
    CreateTextVariable:
      allOf:
        - $ref: '#/components/schemas/IdCreateEnvelope'
        - $ref: '#/components/schemas/TextVariableConfig'
    CreateMath2xId:
      allOf:
        - $ref: '#/components/schemas/IdCreateEnvelope'
        - $ref: '#/components/schemas/Math2xIdConfig'
    IdCreate:
      oneOf:
        - $ref: '#/components/schemas/CreateDigitalInput'
        - $ref: '#/components/schemas/CreateDigitalOutput'
        - $ref: '#/components/schemas/CreateDigitalPullup'
        - $ref: '#/components/schemas/CreateAnalogInput'
        - $ref: '#/components/schemas/CreateInterrupt'
        - $ref: '#/components/schemas/CreateMomentaryOutput'
        - $ref: '#/components/schemas/CreateDelayedOutput'
        - $ref: '#/components/schemas/CreateTextVariable'
        - $ref: '#/components/schemas/CreateMath2xId'
        - $ref: '#/components/schemas/UpdateIdMetadata'
      discriminator:
        propertyName: type
        mapping:
          digitalInput: '#/components/schemas/CreateDigitalInput'
          digitalOutput: '#/components/schemas/CreateDigitalOutput'
          digitalPullup: '#/components/schemas/CreateDigitalPullup'
          analogInput: '#/components/schemas/CreateAnalogInput'
          interrupt: '#/components/schemas/CreateInterrupt'
          momentaryOutput: '#/components/schemas/CreateMomentaryOutput'
          delayedOutput: '#/components/schemas/CreateDelayedOutput'
          textVariable: '#/components/schemas/CreateTextVariable'
          math2xId: '#/components/schemas/CreateMath2xId'
    IdConfigured:
      allOf:
        - $ref: '#/components/schemas/Confirmed'
        - type: object
          required:
            - idNumber
            - type
          properties:
            idNumber:
              type: integer
            type:
              $ref: '#/components/schemas/IdType'
            result:
              type: string
              const: ok
        - type: object
          description: The configuration the device accepted, echoed back.
          properties:
            pin:
              type:
                - integer
                - 'null'
            bootState:
              type:
                - string
                - 'null'
            triggerState:
              type:
                - string
                - 'null'
            revertState:
              type:
                - string
                - 'null'
            durationMs:
              type:
                - integer
                - 'null'
            delayMs:
              type:
                - integer
                - 'null'
            state:
              type:
                - string
                - 'null'
            edge:
              type:
                - string
                - 'null'
            enabled:
              type:
                - boolean
                - 'null'
            intervalMs:
              type:
                - integer
                - 'null'
            threshold:
              type:
                - number
                - 'null'
            trigger:
              oneOf:
                - $ref: '#/components/schemas/Action'
                - type: 'null'
              description: >
                What an `interrupt` fires when it trips — the same `Action` the write accepts, so it
                can be read here and sent straight back. Null when nothing is configured.
            referenceMv:
              type:
                - integer
                - 'null'
            maxVoltage:
              type:
                - number
                - 'null'
            pinMode:
              type:
                - string
                - 'null'
              enum:
                - input
                - inputPullup
                - inputPulldown
                - null
              description: How an `interrupt` ID's pin is biased. Null on every other type.
            text:
              type:
                - string
                - 'null'
            id1:
              type:
                - integer
                - 'null'
            id2:
              type:
                - integer
                - 'null'
            operator:
              type:
                - string
                - 'null'
            updateMs:
              type:
                - integer
                - 'null'
            updateMode:
              type:
                - string
                - 'null'
              enum:
                - onChange
                - never
                - always
                - null
              description: >
                `always` is readable here but not settable through the write schema — see
                UpdateMode. A device configured to report `always` continues to report it.
        - type: object
          description: >
            The cloud layer: what this ID MEANS, what it says, and what it is paired with. None of
            it is held on the device.
          properties:
            states:
              type:
                - array
                - 'null'
              items:
                $ref: '#/components/schemas/IdStateEntry'
              description: >
                The sentences this ID says, exactly as they were written, with the sentence tokens
                **unexpanded** — `{ioName}` comes back as `{ioName}`, not as the ID's name. This is
                the configuration, not a preview of it.


                The effective list: the owner's, where they have set one, otherwise whatever the
                deploy provisioned. `null` means this ID narrates nothing.
            showActor:
              type: boolean
              description: Whether this ID's sentences name the person who caused the change.
            linkedIo:
              type:
                - integer
                - 'null'
              description: >
                The link **actually in force** — the owner's where they set one, the template's
                otherwise, and `null` where the owner explicitly unlinked. Not the raw stored field.
    IdState:
      allOf:
        - type: object
          required:
            - idNumber
            - type
          properties:
            idNumber:
              type: integer
            type:
              $ref: '#/components/schemas/IdTypeReported'
            value:
              $ref: '#/components/schemas/IdValueField'
            at:
              type:
                - string
                - 'null'
              format: date-time
            name:
              type:
                - string
                - 'null'
              description: >
                The name in force: yours if you have set one, the product author's otherwise, and
                `null` where neither exists or where you cleared yours deliberately. Set it on a
                create or a metadata write.
            stateKeywords:
              type:
                - object
                - 'null'
              additionalProperties:
                type: string
              description: >
                What each raw level means on this hardware, e.g. `{"0":"Open","1":"Closed"}`. Where
                present these are authoritative — on an active-low relay the levels are inverted,
                and the author is the only one who knows.
        - type: object
          description: The ID's configuration, as the device holds it.
          properties:
            pin:
              type:
                - integer
                - 'null'
            bootState:
              type:
                - string
                - 'null'
            triggerState:
              type:
                - string
                - 'null'
            revertState:
              type:
                - string
                - 'null'
            durationMs:
              type:
                - integer
                - 'null'
            delayMs:
              type:
                - integer
                - 'null'
            state:
              type:
                - string
                - 'null'
            edge:
              type:
                - string
                - 'null'
            enabled:
              type:
                - boolean
                - 'null'
            intervalMs:
              type:
                - integer
                - 'null'
            threshold:
              type:
                - number
                - 'null'
            trigger:
              oneOf:
                - $ref: '#/components/schemas/Action'
                - type: 'null'
              description: >
                What an `interrupt` fires when it trips — the same `Action` the write accepts, so it
                can be read here and sent straight back. Null when nothing is configured.
            referenceMv:
              type:
                - integer
                - 'null'
            maxVoltage:
              type:
                - number
                - 'null'
            pinMode:
              type:
                - string
                - 'null'
              enum:
                - input
                - inputPullup
                - inputPulldown
                - null
              description: How an `interrupt` ID's pin is biased. Null on every other type.
            text:
              type:
                - string
                - 'null'
            id1:
              type:
                - integer
                - 'null'
            id2:
              type:
                - integer
                - 'null'
            operator:
              type:
                - string
                - 'null'
            updateMs:
              type:
                - integer
                - 'null'
            updateMode:
              type:
                - string
                - 'null'
              enum:
                - onChange
                - never
                - always
                - null
              description: >
                `always` is readable here but not settable through the write schema — see
                UpdateMode. A device configured to report `always` continues to report it.
    IdValueField:
      type:
        - number
        - string
        - 'null'
      description: |
        Each type reports its value in its own natural form:

        · `digitalInput`, `digitalOutput`, `digitalPullup` — `"high"` or `"low"`
        · `analogInput` — a number in the calibrated unit, or raw pin millivolts when the ID is
          uncalibrated (neither `referenceMv` nor `maxVoltage` set)
        · `interrupt` — `"high"` or `"low"`, the pin's current state
        · `textVariable` — the stored string
        · `math2xId` — the computed number

        `null` when nothing has been read yet.
    IdValue:
      type: object
      required:
        - idNumber
        - value
      properties:
        idNumber:
          type: integer
        type:
          $ref: '#/components/schemas/IdTypeReported'
        deviceReply:
          type: integer
          const: -1
          description: Present only when `type` is `unsupported`. See IdTypeReported.
        value:
          $ref: '#/components/schemas/IdValueField'
        at:
          type: string
          format: date-time
    ValueWritten:
      allOf:
        - $ref: '#/components/schemas/Confirmed'
        - type: object
          required:
            - idNumber
            - value
          properties:
            idNumber:
              type: integer
            value:
              $ref: '#/components/schemas/IdValueField'
      example:
        status: confirmed
        serial: ABCD1234
        requestId: open-gate
        idNumber: 1
        value: high
        at: '2026-08-12T14:03:11.200Z'
    Position:
      type: object
      required:
        - latitude
        - longitude
      properties:
        latitude:
          type: number
          description: Decimal degrees.
        longitude:
          type: number
          description: Decimal degrees.
        at:
          type: string
          format: date-time
          description: When the fix was **taken**, per the device's own GNSS clock — not when it reached us.
    TrackPoint:
      allOf:
        - $ref: '#/components/schemas/Position'
        - type: object
          properties:
            speedKmh:
